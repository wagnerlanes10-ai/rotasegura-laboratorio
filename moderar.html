<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RotaSegura · Moderação</title>
<style>
:root{--bg:#0b0f14;--card:#11161d;--line:#ffffff1f;--tx:#e6edf3;--mut:#9aa6b2;--green:#34d399;--red:#ff3b30;--amber:#ff9500;--blue:#3a86ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Arial,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}h1 small{font-size:11px;color:var(--mut);font-weight:400}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:#ffffff14}.btn:hover{background:#ffffff22}
.btn.danger{background:rgba(255,59,48,.16);color:#ff8a80;border:1px solid #ff3b3055}
.btn.ok{background:rgba(52,211,153,.16);color:var(--green);border:1px solid #34d39955}
.login{max-width:340px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.login input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b0f14;color:var(--tx);font-size:15px;margin:10px 0}
.login .btn{width:100%}
.err{color:#ff8a80;font-size:12px;min-height:16px;margin-top:6px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
.b-alto{background:rgba(255,59,48,.18);color:#ff8a80}.b-medio{background:rgba(255,149,0,.18);color:#ffc078}.b-baixo{background:rgba(58,134,255,.18);color:#9ec5ff}.b-flagged{background:#ffffff14;color:var(--mut)}
.coord{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut)}
.meta{font-size:12px;color:var(--mut);margin:7px 0 0}.meta b{color:var(--tx);font-weight:700}
.note{font-size:12px;color:#cdd6df;margin-top:6px;background:#ffffff0a;border-radius:8px;padding:6px 8px}
.acts{display:flex;gap:8px;margin-top:11px}
.empty{color:var(--mut);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#000c;border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
<header id="hdr" style="display:none"><h1>️ Moderação <small>RotaSegura</small></h1><button class="btn" id="logout">Sair</button></header>
<div class="login" id="loginBox"><h1 style="font-size:16px">Acesso restrito</h1><p style="color:var(--mut);font-size:12px;margin:6px 0 0">Digite a senha do moderador (env <code>MOD_TOKEN</code>).</p><input type="password" id="pw" placeholder="senha" autocomplete="off"><button class="btn ok" id="enter">Entrar</button><div class="err" id="loginErr"></div></div>
<div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>sessionStorage.getItem('rs_mod_token')||'';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}
function ago(iso){const d=(Date.now()-Date.parse(iso))/1000;if(d<60)return'agora';if(d<3600)return Math.round(d/60)+' min atrás';if(d<86400)return Math.round(d/3600)+' h atrás';return Math.round(d/86400)+' d atrás';}
function until(iso){const d=(Date.parse(iso)-Date.now())/1000;if(d<=0)return'expirado';if(d<3600)return'em '+Math.round(d/60)+' min';if(d<86400)return'em '+Math.round(d/3600)+' h';return'em '+Math.round(d/86400)+' d';}
async function api(method,body){const r=await fetch('/api/mod',{method,headers:{'Content-Type':'application/json','x-mod-token':token()},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));return{status:r.status,j};}
async function load(){const{status,j}=await api('GET');if(status===401){sessionStorage.removeItem('rs_mod_token');showLogin('Senha inválida.');return;}if(status>=400){$('list').innerHTML='<div class="empty">Erro: '+esc(j.error||status)+'</div>';return;}$('hdr').style.display='flex';$('loginBox').style.display='none';const rows=j.rows||[];if(!rows.length){$('list').innerHTML='<div class="empty">Nenhum reporte ativo.</div>';return;}$('list').innerHTML=rows.map(r=>{const sev=r.severity_eff||'medio';return`<div class="card"><div class="top"><span class="badge b-${esc(sev)}">${esc(sev.toUpperCase())}</span>${r.status==='flagged'?'<span class="badge b-flagged">DENUNCIADO</span>':''}<span class="coord">${(+r.lat).toFixed(5)}, ${(+r.lng).toFixed(5)}</span></div><div class="meta"><b>${esc(r.type||'Reporte')}</b> · ${r.report_count||1} report(s) · raio ${r.radius_m||200} m</div><div class="meta">criado ${ago(r.created_at)} · expira ${until(r.expires_at)}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}<div class="acts"><button class="btn ok" data-a="extend" data-id="${r.id}">✓ Confirmar / +6 h</button><button class="btn danger" data-a="remove" data-id="${r.id}">✕ Remover</button></div></div>`;}).join('');}
$('list').addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id;if(a==='remove'&&!confirm('Remover este reporte?'))return;b.disabled=true;const{status,j}=await api('POST',{action:a,id});if(status>=400){toast('✕ '+(j.error||'falha'));b.disabled=false;return;}toast(a==='extend'?'✔ Renovado por 6 h.':'✔ Removido.');load();});
function showLogin(msg){$('loginBox').style.display='block';$('hdr').style.display='none';$('list').innerHTML='';if(msg)$('loginErr').textContent=msg;}
async function enter(){const pw=$('pw').value.trim();if(!pw){$('loginErr').textContent='Digite a senha.';return;}sessionStorage.setItem('rs_mod_token',pw);$('loginErr').textContent='';await load();}
$('enter').onclick=enter;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});$('logout').onclick=()=>{sessionStorage.removeItem('rs_mod_token');showLogin();};
if(token())load();else showLogin();
</script>
</body>
</html>
