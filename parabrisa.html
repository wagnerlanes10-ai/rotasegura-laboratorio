<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RotaSegura — Modo Para-brisa</title>
<style>
:root {
  --blue: #00bfff;
  --cyan: #42dcff;
  --glass: rgba(2, 17, 39, .94);
  --white: #f4faff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  min-height: 100vh;
  overflow: hidden;
  background: #000;
  color: var(--white);
  font-family: -apple-system, Arial, sans-serif;
}

.windshield {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#cameraFeed {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
}

#rainCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

.ws-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.6) 100%);
  z-index: 3;
  pointer-events: none;
}

.glass {
  background: var(--glass);
  border: 1px solid rgba(0,191,255,.6);
  border-radius: 16px;
  box-shadow: 0 0 18px rgba(0,191,255,.2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* Status bar */
.status-bar {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
}
.status-left { display: flex; align-items: center; gap: 10px; }
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 700;
  padding: 8px 14px;
}
.logo-icon {
  width: 26px; height: 26px;
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.status-right {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 12px;
}

/* Cartão de navegação */
.instruction {
  position: absolute;
  top: 70px;
  left: 16px;
  z-index: 10;
  width: min(320px, calc(100% - 32px));
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.maneuver-icon {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(0,191,255,.6);
}
.maneuver-icon svg { width: 30px; height: 30px; fill: white; }
.instruction-text strong {
  display: block;
  font-size: 17px;
  line-height: 1.3;
}
.instruction-text .distance {
  color: var(--cyan);
  font-size: 14px;
  margin-top: 4px;
  font-weight: 600;
}

/* Botões laterais */
.side {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.side.left { left: 16px; }
.side.right { right: 16px; }
.circle {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--glass);
  border: 1px solid rgba(0,191,255,.6);
  cursor: pointer;
}
.circle svg { width: 22px; height: 22px; fill: var(--cyan); }

/* Seta neon */
#arrowCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 4;
  pointer-events: none;
}

/* HUD inferior */
.metrics {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: min(850px, calc(100% - 32px));
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

/* Velocímetro */
.speedo {
  position: relative;
  width: 64px; height: 64px;
  flex-shrink: 0;
}
.speedo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.speedo-bg { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 5; }
.speedo-fill {
  fill: none;
  stroke: var(--blue);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 176;
  stroke-dashoffset: 176;
  transition: stroke-dashoffset 0.6s ease;
  filter: drop-shadow(0 0 6px rgba(0,191,255,.6));
}
.speedo-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.speedo-val { font-size: 20px; font-weight: 700; }
.speedo-unit { font-size: 9px; color: #8aa4c0; margin-top: 2px; }

.divider {
  width: 1px;
  height: 44px;
  background: rgba(0,191,255,.3);
  flex-shrink: 0;
}

.hud-arrow {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}
.hud-arrow-icon {
  width: 38px; height: 38px;
  background: rgba(0,191,255,.15);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.hud-arrow-icon svg { width: 24px; height: 24px; fill: var(--cyan); filter: drop-shadow(0 0 4px rgba(0,191,255,.6)); }
.hud-arrow-dist { font-size: 18px; font-weight: 700; }
.hud-arrow-label { font-size: 11px; color: #8aa4c0; }

.hud-stats {
  display: flex;
  gap: 16px;
}
.hud-stat { text-align: center; }
.hud-stat-val { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.hud-stat-label { font-size: 10px; color: #8aa4c0; margin-top: 2px; }

/* Botão chuva */
.wiper-btn {
  position: absolute;
  right: 16px;
  bottom: 110px;
  z-index: 10;
  padding: 10px 14px;
  font-size: 13px;
  color: #c5eaff;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

@media (max-width: 480px) {
  .metrics { flex-wrap: wrap; gap: 10px; padding: 10px; }
  .hud-stats { gap: 10px; }
  .instruction { width: calc(100% - 32px); }
}
</style>
</head>
<body>

<main class="windshield">
  <video id="cameraFeed" autoplay playsinline muted></video>
  <canvas id="rainCanvas"></canvas>
  <canvas id="arrowCanvas"></canvas>
  <div class="ws-overlay"></div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="logo glass">
        <div class="logo-icon">️</div>
        <span>RotaSegura</span>
      </div>
    </div>
    <div class="status-right glass">
      <span id="clock">14:32</span>
      <span></span>
      <span>4G</span>
      <span>🔋</span>
    </div>
  </div>

  <!-- Cartão de navegação -->
  <section class="instruction glass">
    <div class="maneuver-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <div class="instruction-text">
      <strong>Na rotatória,<br>pegue a 2ª saída</strong>
      <div class="distance">300 m</div>
    </div>
  </section>

  <!-- Botões laterais -->
  <nav class="side left">
    <div class="circle"><svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg></div>
    <div class="circle"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></div>
    <div class="circle"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></div>
  </nav>

  <nav class="side right">
    <div class="circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--cyan)" stroke-width="1.5"/><polygon points="12,4 14,10 12,12 10,10" fill="#ff5252"/><polygon points="12,20 10,14 12,12 14,14" fill="white"/></svg></div>
    <div class="circle" style="font-size:22px;color:var(--cyan);">+</div>
    <div class="circle" style="font-size:22px;color:var(--cyan);">−</div>
  </nav>

  <!-- HUD inferior -->
  <section class="metrics glass">
    <div class="speedo">
      <svg viewBox="0 0 64 64">
        <circle class="speedo-bg" cx="32" cy="32" r="28"/>
        <circle class="speedo-fill" id="speedoFill" cx="32" cy="32" r="28"/>
      </svg>
      <div class="speedo-text">
        <div class="speedo-val" id="speedVal">52</div>
        <div class="speedo-unit">km/h</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="hud-arrow">
      <div class="hud-arrow-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
      </div>
      <div>
        <div class="hud-arrow-dist">300 m</div>
        <div class="hud-arrow-label">Rotatória</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="hud-stats">
      <div class="hud-stat">
        <div class="hud-stat-val">🕐 12 min</div>
        <div class="hud-stat-label">8,4 km</div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-val">🏁 14:44</div>
        <div class="hud-stat-label">Chegada</div>
      </div>
    </div>
  </section>

  <button class="wiper-btn glass" id="wiperButton">💧 Chuva: ON</button>
</main>

<script>
// ===== RELÓGIO =====
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = 
    now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 30000);

// ===== CÂMERA =====
let cameraStream = null;
async function initCamera() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: { ideal: 'environment' } } 
    });
    document.getElementById('cameraFeed').srcObject = cameraStream;
  } catch (err) {
    console.error('Câmera indisponível:', err);
  }
}
initCamera();

// ===== VELOCÍMETRO ANIMADO =====
let currentSpeed = 52;
function updateSpeedometer() {
  currentSpeed = Math.floor(Math.random() * 20) + 45;
  document.getElementById('speedVal').textContent = currentSpeed;
  const circumference = 2 * Math.PI * 28;
  const offset = circumference - (currentSpeed / 120) * circumference;
  document.getElementById('speedoFill').style.strokeDashoffset = offset;
}
updateSpeedometer();
setInterval(updateSpeedometer, 2000);

// ===== SETA NEON =====
function drawNeonArrow() {
  const canvas = document.getElementById('arrowCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height * 0.72;

    // Glow externo
    ctx.shadowColor = '#00bfff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(0,191,255,0.3)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 60);
    ctx.lineTo(cx - 35, cy + 20);
    ctx.lineTo(cx - 15, cy + 10);
    ctx.lineTo(cx - 15, cy + 40);
    ctx.lineTo(cx + 15, cy + 40);
    ctx.lineTo(cx + 15, cy + 10);
    ctx.lineTo(cx + 35, cy + 20);
    ctx.closePath();
    ctx.fill();

    // Seta principal
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#42dcff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 50);
    ctx.lineTo(cx - 25, cy + 15);
    ctx.lineTo(cx - 10, cy + 8);
    ctx.lineTo(cx - 10, cy + 35);
    ctx.lineTo(cx + 10, cy + 35);
    ctx.lineTo(cx + 10, cy + 8);
    ctx.lineTo(cx + 25, cy + 15);
    ctx.closePath();
    ctx.fill();

    requestAnimationFrame(draw);
  }
  draw();
}
drawNeonArrow();

// ===== CHUVA EM CANVAS =====
let rainActive = true;
let drops = [];
let wiperActive = false;
let wiperProgress = -1;

function initRain() {
  const canvas = document.getElementById('rainCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const count = Math.min(180, Math.max(70, Math.round(canvas.width * canvas.height / 9000)));
  drops = [];
  for (let i = 0; i < count; i++) {
    drops.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: 1 + Math.random() * 2.5,
      speed: 15 + Math.random() * 35,
      drift: -3 + Math.random() * 6,
      opacity: 0.15 + Math.random() * 0.35,
      cleared: 0
    });
  }

  let lastTime = 0;
  let nextWiper = performance.now() + 5000;

  function draw(time) {
    if (!rainActive) { requestAnimationFrame(draw); return; }

    const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.04) : 0.016;
    lastTime = time;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (time >= nextWiper && !wiperActive) {
      wiperActive = true;
      wiperProgress = 0;
    }

    for (const drop of drops) {
      drop.y += drop.speed * dt;
      drop.x += drop.drift * dt;

      if (drop.y > canvas.height + 5 || drop.x < -5 || drop.x > canvas.width + 5) {
        drop.x = Math.random() * canvas.width;
        drop.y = -5;
        drop.cleared = 0;
      }
      if (drop.cleared > 0) drop.cleared = Math.max(0, drop.cleared - dt);

      const alpha = drop.opacity * (drop.cleared > 0 ? 0.1 : 1);

      ctx.beginPath();
      ctx.ellipse(drop.x, drop.y, drop.radius * 0.7, drop.radius * 1.5, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,230,255,${alpha})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(drop.x - drop.radius * 0.25, drop.y - drop.radius * 0.4, drop.radius * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
      ctx.fill();
    }

    if (wiperActive) {
      wiperProgress += dt * 1.2;
      if (wiperProgress >= 1) {
        wiperActive = false;
        wiperProgress = -1;
        nextWiper = time + 7000;
        for (const drop of drops) {
          if (drop.y > canvas.height * 0.3) drop.cleared = 1.5;
        }
      } else {
        const p = wiperProgress;
        const x = canvas.width * 0.1 + (canvas.width * 0.8) * p;
        const y = canvas.height * 0.85 - Math.sin(p * Math.PI) * canvas.height * 0.35;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.shadowColor = '#8beaff';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = 'rgba(180,230,255,0.85)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.5, canvas.height * 0.98);
        ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height * 0.92, x, y);
        ctx.stroke();
        ctx.restore();
      }
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
initRain();

// ===== TOGGLE CHUVA =====
document.getElementById('wiperButton').addEventListener('click', () => {
  rainActive = !rainActive;
  document.getElementById('wiperButton').textContent = rainActive ? '💧 Chuva: ON' : '💧 Chuva: OFF';
  if (!rainActive) {
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
});

window.addEventListener('resize', () => {
  document.getElementById('rainCanvas').width = window.innerWidth;
  document.getElementById('rainCanvas').height = window.innerHeight;
  document.getElementById('arrowCanvas').width = window.innerWidth;
  document.getElementById('arrowCanvas').height = window.innerHeight;
});
</script>
</body>
</html>
