<title>RotaSegura</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1628}

.splash-container{
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse at 50% 30%,#0d2818 0%,#0a1628 50%,#050d18 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:40px 24px 60px;
}

.splash-bg{
  position:absolute;
  inset:0;
  background:url('splash-bg.png?v=5') center center/cover no-repeat;
  opacity:0;
  transition:opacity .5s;
}

.splash-bg.loaded{opacity:1}

.splash-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.5) 60%,rgba(0,0,0,.8) 100%);
  pointer-events:none;
}

.content{
  position:relative;
  z-index:10;
  width:100%;
  max-width:360px;
  text-align:center;
}

.shield{
  width:120px;
  height:120px;
  margin:0 auto 24px;
  filter:drop-shadow(0 0 30px rgba(52,211,153,.6));
  animation:shieldPulse 2s ease-in-out infinite;
}

@keyframes shieldPulse{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 30px rgba(52,211,153,.6))}
  50%{transform:scale(1.05);filter:drop-shadow(0 0 50px rgba(52,211,153,1))}
}

.title{
  font-size:42px;
  font-weight:900;
  color:#34d399;
  margin-bottom:8px;
  text-shadow:0 2px 20px rgba(52,211,153,.6);
  letter-spacing:-1px;
}

.subtitle{
  color:#e2e8f0;
  font-size:16px;
  margin-bottom:32px;
  line-height:1.4;
  text-shadow:0 1px 8px rgba(0,0,0,.8);
}

.enter-btn{
  background:linear-gradient(135deg,#34d399,#10b981);
  color:#06281c;
  border:none;
  padding:20px 48px;
  font-size:18px;
  font-weight:800;
  border-radius:50px;
  cursor:pointer;
  width:100%;
  box-shadow:0 8px 32px rgba(52,211,153,.5);
  transition:all .2s;
}

.enter-btn:active{transform:scale(.96);box-shadow:0 4px 16px rgba(52,211,153,.3)}

.install-hint{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(52,211,153,.9);
  color:#06281c;
  padding:10px 20px;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
  z-index:100;
  display:none;
  animation:slideUp .5s ease-out;
}

@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.splash-container{animation:fadeIn .6s ease-out}
</style>
</head>
<body>

<div class="splash-container">
  <div class="splash-bg" id="splashBg"></div>
  <div class="splash-overlay"></div>
  
  <div class="content">
    <svg class="shield" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path d="M100 20 L160 50 L160 110 Q160 160 100 180 Q40 160 40 110 L40 50 Z" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="2"/>
      <path d="M75 100 L95 120 L130 80" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    
    <h1 class="title">RotaSegura</h1>
    <p class="subtitle">Navegação inteligente com alertas de segurança em tempo real</p>
    <button class="enter-btn" onclick="enterApp()">Entrar no RotaSegura</button>
  </div>
</div>

<div class="install-hint" id="installHint">
  📱 Toque em "Adicionar à tela inicial" para instalar
</div>

<script>
// Tentar carregar imagem de fundo
const splashBg = document.getElementById('splashBg');
const img = new Image();
img.onload = function(){
  splashBg.classList.add('loaded');
  console.log('✅ Imagem splash carregada');
};
img.onerror = function(){
  console.log('❌ Imagem não carregou, usando gradiente');
};
img.src = 'splash-bg.png?v=5';

// Detectar se pode instalar
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installHint').style.display = 'block';
  setTimeout(() => {
    document.getElementById('installHint').style.display = 'none';
  }, 5000);
});

function enterApp(){
  window.location.href = '/index.html';
}

// Instalar app
document.getElementById('installHint').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});
</script>
</body>
</html>
