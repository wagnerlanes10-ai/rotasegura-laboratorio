<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RotaSegura">
<link rel="manifest" href="/manifest.json">
<title>RotaSegura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#000;color:#fff}
#map{position:fixed;inset:0;z-index:1}
.top{position:fixed;top:0;left:0;right:0;z-index:500;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(11,15,20,.92);backdrop-filter:blur(10px)}
.top-row{display:flex;align-items:center;justify-content:space-between}
.brand{color:#34d399;font-weight:800;font-size:16px}
.gps-status{display:flex;align-items:center;gap:6px;background:rgba(52,211,153,.2);padding:6px 12px;border-radius:20px;font-size:12px;color:#34d399}
.gps-status .dot{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.menu-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.search-bar{display:flex;gap:8px}
.search-bar input{flex:1;background:rgba(30,41,59,.9);border:1px solid #334155;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;outline:none}
.search-bar button{background:linear-gradient(135deg,#34d399,#10b981);color:#06281c;border:none;padding:10px 18px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(11,15,20,.95);backdrop-filter:blur(10px);padding:14px;border-top-left-radius:16px;border-top-right-radius:16px;max-height:40vh;overflow-y:auto}
.bottom h3{color:#34d399;font-size:14px;margin-bottom:10px}
.route-info{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.route-info .chip{background:#1e293b;padding:6px 12px;border-radius:8px;font-size:12px;color:#cbd5e1}
.route-info .chip b{color:#fff}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{flex:1;min-width:90px;background:#1e293b;color:#fff;border:1px solid #334155;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
#status{margin-top:8px;font-size:12px;color:#94a3b8;min-height:18px}
#hud{position:fixed;inset:0;z-index:2000;display:none;background:#000;overflow:hidden}
#hud video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#hud .hud-overlay{position:absolute;inset:0;z-index:2}
#hud .hud-overlay>*{pointer-events:auto}
.hud-nav{position:absolute;top:60px;left:16px;right:16px;background:rgba(15,23,42,.95);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;border:1px solid rgba(255,255,255,.1);z-index:5}
.hud-nav-arrow{font-size:48px;color:#fff;line-height:1}
.hud-nav-info h2{color:#fff;font-size:28px;font-weight:800;margin:0}
.hud-nav-info p{color:#94a3b8;font-size:14px;margin:2px 0 0}
.hud-traffic{position:absolute;top:140px;left:16px;background:rgba(15,23,42,.9);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid rgba(255,255,255,.1);z-index:4}
.hud-traffic .status{color:#34d399;font-weight:700}
.hud-street{position:absolute;top:160px;right:80px;background:rgba(30,64,175,.95);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;gap:8px;z-index:4}
.hud-compass{position:absolute;top:160px;right:16px;width:50px;height:50px;background:rgba(15,23,42,.9);border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4}
.hud-compass .needle{font-size:20px;color:#ea4335}
.hud-compass .label{font-size:10px;color:#94a3b8;font-weight:700}
.hud-search{position:absolute;top:225px;right:16px;width:50px;height:50px;background:rgba(15,23,42,.9);border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;z-index:4;cursor:pointer}
.hud-risk{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(220,38,38,.95);color:#fff;padding:14px 18px;border-radius:16px;text-align:center;border:2px solid rgba(255,255,255,.3);animation:riskPulse 1.5s infinite;z-index:4}
@keyframes riskPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.05)}}
.hud-risk b{font-size:22px;display:block;font-weight:800}
.hud-speed-wrap{position:absolute;bottom:200px;left:20px;width:100px;height:100px;z-index:4}
.hud-speed-svg{width:100%;height:100%;transform:rotate(-90deg)}
.hud-speed-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6}
.hud-speed-arc{fill:none;stroke:#34d399;stroke-width:6;stroke-linecap:round;stroke-dasharray:251;stroke-dashoffset:251;transition:stroke-dashoffset .5s ease;filter:drop-shadow(0 0 8px rgba(52,211,153,.8))}
.hud-speed-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hud-speed-text b{font-size:32px;font-weight:800;color:#fff}
.hud-speed-text small{font-size:11px;color:#94a3b8}
.hud-current{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;z-index:4}
.hud-btns{position:absolute;bottom:120px;left:16px;right:16px;display:flex;gap:10px;z-index:4}
.hud-btns button{flex:1;background:rgba(15,23,42,.9);color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.hud-btns button.active-voice{background:rgba(52,211,153,.2);border-color:#34d399;color:#34d399}
.hud-route{position:absolute;bottom:60px;left:16px;right:16px;background:rgba(15,23,42,.95);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.1);z-index:4}
.hud-route-icon{width:44px;height:44px;border-radius:50%;background:#34d399;display:flex;align-items:center;justify-content:center;font-size:22px}
.hud-route-info{flex:1}
.hud-route-info h3{color:#34d399;font-size:15px;font-weight:700;margin:0}
.hud-route-info p{color:#94a3b8;font-size:12px;margin:2px 0 0}
.hud-route-time{text-align:right}
.hud-route-time b{color:#fff;font-size:20px;font-weight:800;display:block}
.hud-route-time span{color:#94a3b8;font-size:11px}
.hud-modes{position:absolute;bottom:0;left:0;right:0;background:rgba(11,15,20,.98);padding:12px 16px;display:flex;gap:8px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.1);z-index:5}
.hud-modes button{flex:0 0 auto;min-width:72px;background:#1e293b;color:#fff;border:2px solid transparent;padding:10px 8px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.hud-modes button .icon{font-size:22px}
.hud-modes button.active{background:rgba(52,211,153,.15);border-color:#34d399;color:#34d399}
.hud-close{position:absolute;top:16px;right:16px;background:rgba(15,23,42,.9);color:#fff;border:1px solid rgba(255,255,255,.2);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:10}
.hud-arrows{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.hud-chevron{position:absolute;left:50%;opacity:0;animation:chevronFlow 2.5s linear infinite;filter:drop-shadow(0 0 10px rgba(100,200,255,.9)) drop-shadow(0 0 18px rgba(100,200,255,.5))}
.hud-chevron svg{width:100%;height:100%}
.hud-chevron:nth-child(1){width:18px;height:18px;animation-delay:0s}
.hud-chevron:nth-child(2){width:26px;height:26px;animation-delay:.25s}
.hud-chevron:nth-child(3){width:36px;height:36px;animation-delay:.5s}
.hud-chevron:nth-child(4){width:48px;height:48px;animation-delay:.75s}
.hud-chevron:nth-child(5){width:62px;height:62px;animation-delay:1s}
.hud-chevron:nth-child(6){width:78px;height:78px;animation-delay:1.25s}
.hud-chevron:nth-child(7){width:96px;height:96px;animation-delay:1.5s}
.hud-chevron:nth-child(8){width:116px;height:116px;animation-delay:1.75s}
.hud-chevron:nth-child(9){width:138px;height:138px;animation-delay:2s}
.hud-chevron:nth-child(10){width:162px;height:162px;animation-delay:2.25s}
@keyframes chevronFlow{0%{bottom:28%;opacity:0;transform:translateX(-50%) scale(.3)}10%{opacity:1;transform:translateX(-50%) scale(1)}90%{opacity:1}100%{bottom:68%;opacity:0;transform:translateX(-50%) scale(1.4)}}
.hud-arrows.curve-right .hud-chevron{animation-name:chevronCurveRight}
@keyframes chevronCurveRight{0%{bottom:28%;left:50%;opacity:0;transform:translateX(-50%) scale(.3)}10%{opacity:1}40%{left:53%;transform:translateX(-50%) scale(1.05) rotate(10deg)}70%{left:57%;transform:translateX(-50%) scale(1.15) rotate(20deg)}90%{opacity:1}100%{bottom:68%;left:62%;opacity:0;transform:translateX(-50%) scale(1.4) rotate(30deg)}}
.hud-arrows.curve-left .hud-chevron{animation-name:chevronCurveLeft}
@keyframes chevronCurveLeft{0%{bottom:28%;left:50%;opacity:0;transform:translateX(-50%) scale(.3)}10%{opacity:1}40%{left:47%;transform:translateX(-50%) scale(1.05) rotate(-10deg)}70%{left:43%;transform:translateX(-50%) scale(1.15) rotate(-20deg)}90%{opacity:1}100%{bottom:68%;left:38%;opacity:0;transform:translateX(-50%) scale(1.4) rotate(-30deg)}}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:2500;display:none;border:1px solid #334155;max-width:90%;text-align:center}
#toast.ok{border-color:#34d399}
#toast.err{border-color:#ea4335}
#reportSheet{position:fixed;bottom:0;left:0;right:0;z-index:2600;background:#0b0f14;border-top:2px solid #34d399;padding:18px;border-radius:18px 18px 0 0;max-height:75vh;overflow-y:auto;display:none}
#reportSheet h3{margin:0 0 10px;color:#34d399;font-size:16px}
#reportSheet label{display:block;margin:8px 0 4px;color:#cbd5e1;font-size:13px}
#reportSheet select,#reportSheet input,#reportSheet textarea{width:100%;background:#1e293b;border:1px solid #334155;color:#fff;padding:8px;border-radius:6px;font-size:13px;outline:none}
#reportSheet textarea{min-height:70px;resize:vertical}
#reportSheet .row{display:flex;gap:6px;margin-top:12px}
#reportSheet .row button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
#reportSheet .row .cancel{background:#334155;color:#fff}
#reportSheet .row .submit{background:#34d399;color:#06281c}
.legend{position:fixed;bottom:16px;right:16px;z-index:400;background:rgba(11,15,20,.9);padding:8px 12px;border-radius:8px;font-size:11px;color:#cbd5e1;border:1px solid #1e293b}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend .dot{width:10px;height:10px;border-radius:50%}
.risk-circle{fill-opacity:.25;stroke-width:2}
.risk-alto{fill:#ea4335;stroke:#ea4335}
.risk-medio{fill:#fbbc04;stroke:#fbbc04}
.risk-baixo{fill:#34a853;stroke:#34a853}
.route-line{stroke:#34d399;stroke-width:6;stroke-opacity:.9;fill:none;filter:drop-shadow(0 0 8px rgba(52,211,153,.6))}
</style>
</head>
<body>
<div id="map"></div>

    <div class="brand">🛡️ RotaSegura</div>

    <button class="menu-btn" onclick="openMenu()">☰</button>
