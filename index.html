<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1628">
<title>RotaSegura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --blue: #29b6f6;
  --blue-glow: rgba(41, 182, 246, 0.5);
  --bg: #0a1628;
  --panel: rgba(10, 22, 40, 0.92);
  --panel-border: rgba(41, 182, 246, 0.3);
  --text: #e8f4ff;
  --muted: #8aa4c0;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

#map { position: absolute; inset: 0; z-index: 1; }

/* Filtro para modo noturno no mapa */
.map-night .leaflet-tile-pane {
  filter: brightness(0.55) invert(1) contrast(1.1) hue-rotate(195deg) saturate(0.7);
}
.map-night .leaflet-tile-pane img {
  filter: brightness(0.9);
}

/* ===== CARTÃO DE NAVEGAÇÃO SUPERIOR ===== */
#navCard {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 1000;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 14px 16px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

.nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 700;
  color: var(--blue);
}
.brand-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.nav-time {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Instrução de navegação */
.nav-instruction {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
}
.nav-arrow {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 20px var(--blue-glow);
}
.nav-arrow svg { width: 32px; height: 32px; fill: white; }
.nav-text { flex: 1; }
.nav-action { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.2; }
.nav-distance { font-size: 13px; color: var(--muted); margin-top: 2px; }
.nav-street { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Busca (aparece antes de calcular rota) */
.search-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
}
.search-input {
  flex: 1;
  height: 44px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 0 14px;
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.search-input::placeholder { color: var(--muted); }
.search-btn {
  height: 44px;
  padding: 0 22px;
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 16px var(--blue-glow);
}
.search-btn:disabled { opacity: 0.5; }

.status-text {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== BOTÕES LATERAIS ===== */
.side-controls {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.side-btn {
  width: 44px; height: 44px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(12px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.side-btn svg { width: 20px; height: 20px; fill: var(--text); }
.side-btn:active { transform: scale(0.92); }

/* ===== HUD INFERIOR ===== */
#bottomHUD {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  z-index: 1000;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 12px 14px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
  display: none;
}
#bottomHUD.show { display: block; }

.hud-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Velocímetro circular */
.speedo {
  position: relative;
  width: 64px; height: 64px;
  flex-shrink: 0;
}
.speedo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.speedo-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 5; }
.speedo-fill {
  fill: none;
  stroke: var(--blue);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 176;
  stroke-dashoffset: 176;
  transition: stroke-dashoffset 0.6s ease;
  filter: drop-shadow(0 0 6px var(--blue-glow));
}
.speedo-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.speedo-val { font-size: 20px; font-weight: 700; color: var(--text); }
.speedo-unit { font-size: 9px; color: var(--muted); margin-top: 2px; }

/* Setas de navegação no HUD */
.hud-arrows {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.hud-arrow-icon {
  width: 36px; height: 36px;
  background: rgba(41, 182, 246, 0.15);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.hud-arrow-icon svg { width: 22px; height: 22px; fill: var(--blue); filter: drop-shadow(0 0 4px var(--blue-glow)); }
.hud-arrow-info { flex: 1; }
.hud-arrow-dist { font-size: 16px; font-weight: 700; color: var(--text); }
.hud-arrow-label { font-size: 11px; color: var(--muted); }

/* Stats */
.hud-stats {
  display: flex;
  gap: 14px;
  align-items: center;
}
.hud-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.hud-stat-val { font-size: 15px; font-weight: 700; color: var(--text); }
.hud-stat-label { font-size: 10px; color: var(--muted); }
.hud-stat-icon { font-size: 14px; margin-bottom: 1px; }

/* ===== ZOOM CONTROLS ===== */
.leaflet-control-zoom { border: none !important; box-shadow: 0 2px 12px rgba(0,0,0,0.3) !important; }
.leaflet-control-zoom a {
  background: var(--panel) !important;
  color: var(--text) !important;
  border: 1px solid var(--panel-border) !important;
  width: 40px !important; height: 40px !important;
  line-height: 40px !important;
  font-size: 20px !important;
}
.leaflet-control-zoom a:first-child { border-radius: 10px 10px 0 0 !important; }
.leaflet-control-zoom a:last-child { border-radius: 0 0 10px 10px !important; }
.leaflet-control-attribution {
  background: rgba(10,22,40,0.7) !important;
  color: var(--muted) !important;
  font-size: 9px !important;
}
.leaflet-control-attribution a { color: var(--blue) !important; }

/* User dot */
.user-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--blue);
  border: 3px solid white;
  box-shadow: 0 0 0 4px var(--blue-glow), 0 2px 8px rgba(0,0,0,0.4);
}
.dest-pin {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #ff5252, #d32f2f);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 3px solid white;
  box-shadow: 0 2px 10px rgba(211,47,47,0.5);
  display: flex; align-items: center; justify-content: center;
}
.dest-pin::after {
  content: '';
  width: 8px; height: 8px;
  background: white;
  border-radius: 50%;
  transform: rotate(45deg);
}

/* Alerta de risco */
.risk-alert {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(211, 47, 47, 0.95);
  border: 2px solid #ff5252;
  border-radius: 16px;
  padding: 20px 28px;
  text-align: center;
  z-index: 1500;
  display: none;
  animation: riskPulse 1.5s infinite;
  box-shadow: 0 0 30px rgba(255, 82, 82, 0.5);
}
.risk-alert.show { display: block; }
.risk-alert-title { font-size: 18px; font-weight: 700; color: white; }
.risk-alert-sub { font-size: 13px; color: rgba(255,255,255,0.9); margin-top: 4px; }
@keyframes riskPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.05); }
}

/* ===== MODO PARA-BRISA (CÂMERA + GOTAS) ===== */
#windshieldView {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: #000;
}
#cameraFeed {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#windshieldView .hud-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(3,16,37,0.7) 0%, rgba(3,16,37,0) 35%, rgba(3,16,37,0.85) 100%);
  pointer-events: none;
}

/* Canvas das gotas */
#rainCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* Botão toggle do para-brisa - estilo Neon */
#rainToggleBtn {
  position: fixed;
  right: 14px;
  bottom: 85px;
  z-index: 2600;
  padding: 11px 15px;
  border-radius: 22px;
  border: 1px solid var(--blue);
  background: rgba(3, 18, 40, 0.94);
  color: var(--text);
  font: 600 13px system-ui, -apple-system, sans-serif;
  box-shadow: 0 0 14px rgba(0,191,255,0.28);
  cursor: pointer;
  display: none;
  backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}
#rainToggleBtn:hover {
  background: rgba(41, 182, 246, 0.15);
  box-shadow: 0 0 18px rgba(0,191,255,0.4);
}
#rainToggleBtn:active {
  transform: scale(0.95);
}

/* HUD dentro do modo para-brisa */
#windshieldView .windshield-hud {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  z-index: 10;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 12px 14px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
}

#windshieldView .windshield-nav {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 14px 20px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  text-align: center;
  min-width: 280px;
  z-index: 10;
}
.windshield-nav .nav-arrow-icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  box-shadow: 0 0 20px var(--blue-glow);
}
.windshield-nav .nav-arrow-icon svg { width: 28px; height: 28px; fill: white; }
.windshield-nav .nav-action { font-size: 18px; font-weight: 700; color: var(--text); }
.windshield-nav .nav-distance { font-size: 14px; color: var(--blue); margin-top: 4px; }

#windshieldView .hud-exit-btn {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 28px;
  border-radius: 24px;
  border: 1px solid var(--blue);
  background: rgba(3, 18, 40, 0.94);
  color: var(--text);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(0,191,255,0.3);
  z-index: 2600;
  backdrop-filter: blur(10px);
}

@media (max-width: 480px) {
  #navCard, #bottomHUD, #windshieldView .windshield-hud { border-radius: 14px; padding: 12px; }
  .nav-arrow { width: 46px; height: 46px; }
  .speedo { width: 56px; height: 56px; }
  .speedo-val { font-size: 18px; }
  #rainToggleBtn { bottom: 80px; font-size: 12px; padding: 10px 13px; }
}
</style>
</head>
<body>

<div id="map"></div>

<!-- Cartão de Navegação Superior -->
<div id="navCard">
  <div class="nav-header">
    <div class="brand">
      <div class="brand-icon">️</div>
      <span>RotaSegura</span>
    </div>
    <div class="nav-time">
      <span>📶</span>
      <span id="clock">--:--</span>
    </div>
  </div>

  <!-- Antes da rota: busca -->
  <div id="searchView">
    <div class="search-row">
      <input class="search-input" id="destino" placeholder="Para onde? Ex.: Av. Paulista, SP" autocomplete="off">
      <button class="search-btn" id="buscar">Ir</button>
    </div>
    <div class="status-text" id="status"> Obtendo sua localização…</div>
  </div>

  <!-- Após calcular rota: instrução -->
  <div id="instructionView" style="display:none;">
    <div class="nav-instruction">
      <div class="nav-arrow">
        <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
      </div>
      <div class="nav-text">
        <div class="nav-action" id="navAction">Siga em frente</div>
        <div class="nav-distance" id="navDistance">350 m</div>
        <div class="nav-street" id="navStreet">Av. Principal</div>
      </div>
    </div>
  </div>
</div>

<!-- Botões Laterais -->
<div class="side-controls">
  <button class="side-btn" id="locateBtn" title="Minha localização">
    <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
  </button>
  <button class="side-btn" id="windshieldBtn" title="Modo Para-brisa" style="display:none;">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
  </button>
  <button class="side-btn" id="themeBtn" title="Modo dia/noite">
    <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
</div>

<!-- HUD Inferior -->
<div id="bottomHUD">
  <div class="hud-row">
    <!-- Velocímetro -->
    <div class="speedo">
      <svg viewBox="0 0 64 64">
        <circle class="speedo-bg" cx="32" cy="32" r="28"/>
        <circle class="speedo-fill" id="speedoFill" cx="32" cy="32" r="28"/>
      </svg>
      <div class="speedo-text">
        <div class="speedo-val" id="speedVal">0</div>
        <div class="speedo-unit">km/h</div>
      </div>
    </div>

    <!-- Setas de navegação -->
    <div class="hud-arrows">
      <div class="hud-arrow-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
      </div>
      <div class="hud-arrow-info">
        <div class="hud-arrow-dist" id="hudDist">350 m</div>
        <div class="hud-arrow-label" id="hudLabel">Siga em frente</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="hud-stats">
      <div class="hud-stat">
        <div class="hud-stat-icon">️</div>
        <div class="hud-stat-val" id="hudTime">12 min</div>
        <div class="hud-stat-label">tempo</div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-icon">📏</div>
        <div class="hud-stat-val" id="hudKm">8.4 km</div>
        <div class="hud-stat-label">total</div>
      </div>
      <div class="hud-stat">
        <div class="hud-stat-icon">🏁</div>
        <div class="hud-stat-val" id="hudArrival">14:44</div>
        <div class="hud-stat-label">chegada</div>
      </div>
    </div>
  </div>
</div>

<!-- Modo Para-brisa com Câmera e Gotas -->
<div id="windshieldView">
  <video id="cameraFeed" autoplay playsinline muted></video>
  <canvas id="rainCanvas"></canvas>
  <div class="hud-overlay"></div>
  
  <div class="windshield-nav">
    <div class="nav-arrow-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>
    </div>
    <div class="nav-action" id="wsNavAction">Siga em frente</div>
    <div class="nav-distance" id="wsNavDistance">350 m</div>
  </div>

  <button class="hud-exit-btn" onclick="toggleWindshield(false)"> Sair do Para-brisa</button>
  
  <!-- Botão toggle das gotas -->
  <button id="rainToggleBtn">💧 Chuva: ON</button>
</div>

<!-- Alerta de Risco -->
<div class="risk-alert" id="riskAlert">
  <div class="risk-alert-title">⚠️ PONTO DE RISCO</div>
  <div class="risk-alert-sub">Área com histórico de ocorrências a 350m</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== MAPA =====
const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([-23.5505, -46.6333], 13);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Tiles OSM (não precisa de API key)
const osmDay = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
});
osmDay.addTo(map);

let isNight = true; // Já inicia no modo noturno
let userPos = null, userMarker = null, destMarker = null;
let routeLayers = [], lastBounds = null;
let currentSpeed = 0;

const $ = id => document.getElementById(id);

// Relógio
function updateClock() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
updateClock();
setInterval(updateClock, 30000);

// Tema dia/noite
function toggleTheme() {
  isNight = !isNight;
  document.body.classList.toggle('map-night', isNight);
  $('themeIcon').innerHTML = isNight
    ? '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>'
    : '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
}
$('themeBtn').onclick = toggleTheme;

// GPS
function drawUser(pos) {
  userPos = [pos.coords.latitude, pos.coords.longitude];
  const icon = L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
  if (userMarker) userMarker.setLatLng(userPos);
  else userMarker = L.marker(userPos, { icon, zIndexOffset: 1000 }).addTo(map);
  map.setView(userPos, 15);
  $('status').textContent = '✅ Localização ativa.';
  $('windshieldBtn').style.display = 'flex'; // Mostra botão do para-brisa
}

function locate() {
  if (!navigator.geolocation) {
    $('status').textContent = '⚠️ GPS indisponível. Toque no mapa.';
    return;
  }
  $('status').textContent = '📡 Buscando localização…';
  navigator.geolocation.getCurrentPosition(
    p => drawUser(p),
    err => {
      const msgs = { 1: '⚠️ Permissão negada. Toque no mapa.', 2: '️ GPS indisponível.', 3: '️ Tempo esgotado.' };
      $('status').textContent = msgs[err.code] || '⚠️ Erro no GPS.';
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 5000 }
  );
}

map.on('click', e => {
  if (!userPos) {
    userPos = [e.latlng.lat, e.latlng.lng];
    drawUser({ coords: { latitude: userPos[0], longitude: userPos[1] } });
    $('status').textContent = '✅ Ponto definido manualmente.';
  }
});

$('locateBtn').onclick = locate;
locate();

// Geocoding e Rota
async function geocode(q) {
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q=' + encodeURIComponent(q), { headers: { 'Accept-Language': 'pt-BR' } });
  if (!r.ok) throw new Error('geocode');
  const a = await r.json();
  if (!a.length) throw new Error('notfound');
  return { lat: +a[0].lat, lon: +a[0].lon, name: a[0].display_name };
}

async function route(from, to) {
  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to.lon},${to.lat}?overview=full&geometries=geojson&alternatives=false&steps=true`);
  if (!r.ok) throw new Error('route');
  return r.json();
}

function drawRoutes(data) {
  routeLayers.forEach(x => map.removeLayer(x));
  routeLayers = [];

  const route = data.routes[0];
  if (!route) return;

  const pts = route.geometry.coordinates.map(c => [c[1], c[0]]);

  // Efeito neon: camada externa (glow)
  const glow = L.polyline(pts, {
    color: '#29b6f6',
    weight: 14,
    opacity: 0.35,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);

  // Camada principal
  const line = L.polyline(pts, {
    color: '#42dcff',
    weight: 7,
    opacity: 1,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);

  // Camada interna (branco)
  const inner = L.polyline(pts, {
    color: '#ffffff',
    weight: 2,
    opacity: 0.6,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(map);

  routeLayers.push(glow, line, inner);

  // Atualizar HUD
  const durationMin = Math.max(1, Math.round(route.duration / 60));
  const distanceKm = (route.distance / 1000).toFixed(1);
  const arrival = new Date(Date.now() + route.duration * 1000);
  const arrivalStr = arrival.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  $('hudTime').textContent = durationMin + ' min';
  $('hudKm').textContent = distanceKm + ' km';
  $('hudArrival').textContent = arrivalStr;
  $('hudDist').textContent = '350 m';
  $('hudLabel').textContent = 'Siga em frente';
  $('navAction').textContent = 'Siga em frente';
  $('navDistance').textContent = '350 m';
  $('navStreet').textContent = 'Av. Principal';
  
  // Atualizar HUD do para-brisa também
  $('wsNavAction').textContent = 'Siga em frente';
  $('wsNavDistance').textContent = '350 m';

  // Mostrar HUD e instrução
  $('bottomHUD').classList.add('show');
  $('searchView').style.display = 'none';
  $('instructionView').style.display = 'block';

  // Ajustar mapa
  const bounds = L.latLngBounds(pts);
  map.fitBounds(bounds, { padding: [80, 20], maxZoom: 16 });

  // Simular alerta de risco após 5s
  setTimeout(() => {
    $('riskAlert').classList.add('show');
    setTimeout(() => $('riskAlert').classList.remove('show'), 5000);
  }, 5000);

  // Simular velocidade
  simulateSpeed();
}

function simulateSpeed() {
  const circumference = 2 * Math.PI * 28;
  setInterval(() => {
    currentSpeed = Math.floor(Math.random() * 30) + 35;
    $('speedVal').textContent = currentSpeed;
    const offset = circumference - (currentSpeed / 120) * circumference;
    $('speedoFill').style.strokeDashoffset = offset;
  }, 2000);
}

async function buscar() {
  const q = $('destino').value.trim();
  if (!q) { $('status').textContent = 'Digite um destino.'; return; }
  if (!userPos) { $('status').textContent = 'Aguardando localização…'; locate(); return; }

  const btn = $('buscar');
  btn.disabled = true;
  btn.textContent = '…';

  try {
    $('status').textContent = '🔎 Localizando destino…';
    const dest = await geocode(q);

    if (destMarker) map.removeLayer(destMarker);
    const icon = L.divIcon({ className: '', html: '<div class="dest-pin"></div>', iconSize: [32, 32], iconAnchor: [16, 32] });
    destMarker = L.marker([dest.lat, dest.lon], { icon }).addTo(map);

    $('status').textContent = '🛣️ Calculando rota…';
    const data = await route(userPos, dest);
    if (data.code !== 'Ok' || !data.routes.length) throw new Error('noroute');

    drawRoutes(data);
    $('status').textContent = '✅ Rota segura calculada.';
  } catch (e) {
    $('status').textContent = e.message === 'notfound' ? '❌ Destino não encontrado.' : '❌ Erro ao calcular rota.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ir';
  }
}

$('buscar').onclick = buscar;
$('destino').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

// ===== MODO PARA-BRISA COM CÂMERA =====
let cameraStream = null;

function toggleWindshield(show) {
  const view = $('windshieldView');
  const video = $('cameraFeed');
  
  if (show) {
    view.style.display = 'block';
    $('rainToggleBtn').style.display = 'block';
    initRainEffect(); // Inicia efeito de chuva
    
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { ideal: "environment" } } 
      });
      video.srcObject = cameraStream;
    } catch (err) {
      alert('Erro ao acessar câmera. Verifique as permissões.');
      toggleWindshield(false);
    }
  } else {
    view.style.display = 'none';
    $('rainToggleBtn').style.display = 'none';
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    // Para animação da chuva
    if (window.rainAnimationId) {
      cancelAnimationFrame(window.rainAnimationId);
    }
  }
}

$('windshieldBtn').onclick = () => toggleWindshield(true);

// ===== EFEITO DE CHUVA E LIMPADOR (Integrado do seu código) =====
function initRainEffect() {
  const canvas = $('rainCanvas');
  const ctx = canvas.getContext('2d');
  
  let ativo = true;
  let limpadorAtivo = false;
  let animacao = 0;
  let gotas = [];
  let largura = 0;
  let altura = 0;
  let ultimoTempo = 0;
  let proximaLimpeza = 0;
  let progressoLimpador = -1;

  function redimensionar() {
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    largura = window.innerWidth;
    altura = window.innerHeight;
    canvas.width = Math.round(largura * dpr);
    canvas.height = Math.round(altura * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    criarGotas();
  }

  function criarGotas() {
    gotas = [];
    const quantidade = Math.min(150, Math.max(45, Math.round(largura * altura / 11000)));
    for (let i = 0; i < quantidade; i++) {
      gotas.push({
        x: Math.random() * largura,
        y: Math.random() * altura,
        raio: 0.8 + Math.random() * 2.2,
        velocidade: 12 + Math.random() * 32,
        deriva: -5 + Math.random() * 10,
        opacidade: 0.12 + Math.random() * 0.3,
        limpa: 0
      });
    }
  }

  function desenhar(tempo) {
    if (!ativo) return;

    const dt = ultimoTempo ? Math.min((tempo - ultimoTempo) / 1000, 0.04) : 0.016;
    ultimoTempo = tempo;

    ctx.clearRect(0, 0, largura, altura);

    // Reflexo discreto
    const gradiente = ctx.createLinearGradient(0, 0, largura, altura);
    gradiente.addColorStop(0, 'rgba(100,190,255,.035)');
    gradiente.addColorStop(0.5, 'rgba(100,190,255,0)');
    gradiente.addColorStop(1, 'rgba(100,190,255,.045)');
    ctx.fillStyle = gradiente;
    ctx.fillRect(0, 0, largura, altura);

    if (tempo >= proximaLimpeza && !limpadorAtivo) {
      limpadorAtivo = true;
      progressoLimpador = 0;
    }

    for (const g of gotas) {
      g.y += g.velocidade * dt;
      g.x += g.deriva * dt;

      if (g.y > altura + 5 || g.x < -5 || g.x > largura + 5) {
        g.x = Math.random() * largura;
        g.y = -5;
        g.limpa = 0;
      }

      if (g.limpa > 0) g.limpa = Math.max(0, g.limpa - dt);

      const transparência = g.opacidade * (g.limpa > 0 ? 0.12 : 1);

      ctx.beginPath();
      ctx.ellipse(g.x, g.y, g.raio * 0.7, g.raio * 1.5, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(205,235,255,${transparência})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(g.x - g.raio * 0.25, g.y - g.raio * 0.4, g.raio * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${transparência * 0.8})`;
      ctx.fill();
    }

    // Limpador visual
    if (limpadorAtivo) {
      progressoLimpador += dt * 1.45;
      const p = progressoLimpador;

      if (p >= 1) {
        limpadorAtivo = false;
        progressoLimpador = -1;
        proximaLimpeza = tempo + 6500;

        for (const g of gotas) {
          if (g.y > altura * 0.35) g.limpa = 1.2;
        }
      } else {
        const inicio = largura * 0.08;
        const fim = largura * 0.92;
        const x = inicio + (fim - inicio) * p;
        const y = altura * 0.80 - Math.sin(p * Math.PI) * altura * 0.28;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.shadowColor = '#8beaff';
        ctx.shadowBlur = 8;
        ctx.strokeStyle = 'rgba(190,240,255,.7)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(largura * 0.5, altura * 0.94);
        ctx.quadraticCurveTo(largura * 0.34, altura * 0.88, x, y);
        ctx.stroke();
        ctx.restore();
      }
    }

    animacao = requestAnimationFrame(desenhar);
  }

  // Botão toggle
  $('rainToggleBtn').onclick = () => {
    ativo = !ativo;
    $('rainToggleBtn').textContent = ativo ? '💧 Chuva: ON' : '💧 Chuva: OFF';
    $('rainToggleBtn').style.background = ativo ? 'rgba(3, 18, 40, .94)' : 'rgba(41, 182, 246, 0.2)';
    
    if (ativo) {
      proximaLimpeza = performance.now() + 4500;
      ultimoTempo = 0;
      desenhar(performance.now());
    } else {
      cancelAnimationFrame(animacao);
      ctx.clearRect(0, 0, largura, altura);
    }
  };

  window.addEventListener('resize', redimensionar);
  redimensionar();
  proximaLimpeza = performance.now() + 4500;
  desenhar(performance.now());
}
</script>
