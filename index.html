<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>RotaSegura Completo com Voz</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg-dark: #070f16;
  --panel: rgba(15, 23, 42, 0.9);
  --panel-border: rgba(255,255,255,0.1);
  --green: #34d399;
  --red: #ef4444;
  --text: #ffffff;
  --muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: var(--text); }

/* ========================================= */
/* TELA INICIAL (MAPA)                       */
/* ========================================= */
#map { position: fixed; inset: 0; z-index: 1; background: var(--bg-dark); }

.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  padding: 15px; display: flex; flex-direction: column; gap: 12px;
  background: linear-gradient(to bottom, rgba(7,15,22,1), rgba(7,15,22,0.8), transparent);
}
.brand { display: flex; align-items: center; justify-content: space-between; color: #fff; font-weight: 800; font-size: 18px; }
.brand-left { display: flex; align-items: center; gap: 6px; }
.brand-left span { color: var(--green); font-size: 22px; }

.search-bar { display: flex; gap: 8px; }
.search-bar input {
  flex: 1; background: var(--panel); border: 1px solid var(--panel-border);
  color: #fff; padding: 14px 16px; border-radius: 12px; font-size: 15px; outline: none;
  backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.search-bar button {
  background: var(--green); color: #000; border: none; padding: 0 20px;
  border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 15px;
}

.bottom-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
  background: var(--bg-dark); padding: 20px 15px;
  border-top-left-radius: 24px; border-top-right-radius: 24px;
  border-top: 1px solid var(--panel-border);
  box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
}
.btn-primary {
  width: 100%; background: var(--green); color: #000; border: none; padding: 16px;
  border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px;
}
.btn-secondary {
  width: 100%; background: #1e293b; color: #fff; border: 1px solid var(--panel-border);
  padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  margin-bottom: 10px;
}

/* ========================================= */
/* MODO PARA-BRISA (HUD) - IDÊNTICO À FOTO   */
/* ========================================= */
#hud { position: fixed; inset: 0; z-index: 2000; display: none; background: #111; overflow: hidden; }
#hud video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
/* Fundo fallback se não tiver câmera */
#hud-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  background: url('https://images.unsplash.com/photo-1542392656-9bc048221431?q=80&w=1000&auto=format&fit=crop') center/cover;
  z-index: 0;
}

/* Estrada Neon 3D */
.road-path {
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  width: 320px; height: 60vh;
  background: linear-gradient(to top, rgba(0, 162, 255, 0.5) 0%, rgba(0, 162, 255, 0.1) 80%, transparent 100%);
  clip-path: polygon(40% 100%, 60% 100%, 100% 0, 0 0);
  z-index: 2; pointer-events: none;
  filter: drop-shadow(0 0 20px rgba(0, 162, 255, 0.8));
}
.chevron-container { position: absolute; inset: 0; z-index: 2; perspective: 500px; pointer-events: none; }
.chevron {
  position: absolute; bottom: 0; left: 50%; width: 140px; height: 90px; margin-left: -70px;
  opacity: 0; animation: driveUp 1.8s linear infinite;
}
.chevron svg { width: 100%; height: 100%; fill: none; stroke: #00d2ff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 12px #00d2ff); }
@keyframes driveUp {
  0% { bottom: 10%; transform: scale(0.1) rotateX(75deg); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { bottom: 85%; transform: scale(1.8) rotateX(75deg); opacity: 0; }
}
.chevron:nth-child(1) { animation-delay: 0s; }
.chevron:nth-child(2) { animation-delay: 0.3s; }
.chevron:nth-child(3) { animation-delay: 0.6s; }
.chevron:nth-child(4) { animation-delay: 0.9s; }
.chevron:nth-child(5) { animation-delay: 1.2s; }
.chevron:nth-child(6) { animation-delay: 1.5s; }

/* Interface sobre o vídeo */
.hud-ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.hud-ui > * { pointer-events: auto; }

.hud-top { padding: 20px; display: flex; flex-direction: column; gap: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
.hud-header { display: flex; justify-content: space-between; align-items: center; }
.hud-nav-card {
  background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px);
  border-radius: 24px; padding: 20px; display: flex; gap: 20px; align-items: center;
  border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.hud-nav-card .arrow { font-size: 56px; color: #fff; line-height: 1; font-weight: 300; }
.hud-nav-card .info h1 { font-size: 34px; font-weight: 800; margin-bottom: 4px; }
.hud-nav-card .info h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.hud-nav-card .info p { font-size: 15px; color: var(--muted); }

.hud-middle { position: relative; flex: 1; }
.hud-traffic {
  position: absolute; top: 10px; left: 20px; background: rgba(15, 23, 42, 0.85);
  padding: 10px 16px; border-radius: 16px; display: flex; gap: 10px; align-items: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
}
.hud-traffic .icon { font-size: 20px; }
.hud-traffic .txt b { display: block; font-size: 13px; color: #fff; }
.hud-traffic .txt span { font-size: 13px; color: var(--green); font-weight: 700; }

.hud-compass {
  position: absolute; top: 10px; right: 20px; width: 54px; height: 54px; background: rgba(15, 23, 42, 0.85);
  border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
}
.hud-compass .arrow { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid var(--red); margin-bottom: 2px; }
.hud-compass .n { color: #fff; font-size: 12px; font-weight: 700; }

.hud-search-btn {
  position: absolute; top: 75px; right: 20px; width: 54px; height: 54px; background: rgba(15, 23, 42, 0.85);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); font-size: 22px; cursor: pointer;
}
.hud-risk {
  position: absolute; top: 140px; right: 20px; background: linear-gradient(135deg, #ef4444, #b91c1c);
  border-radius: 50%; width: 85px; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); border: 2px solid rgba(255,255,255,0.3);
}
.hud-risk .icon { font-size: 26px; margin-bottom: -2px; }
.hud-risk b { font-size: 18px; }
.hud-risk span { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.1; }

.hud-bottom-mid { position: absolute; bottom: 170px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; align-items: flex-end; }
.hud-speed { width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); box-shadow: 0 0 20px rgba(52, 211, 153, 0.4); }
.hud-speed b { font-size: 30px; line-height: 1; }
.hud-speed span { font-size: 12px; color: #fff; }
.hud-street-pill { background: rgba(15, 23, 42, 0.9); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }

.hud-floating-btns { position: absolute; bottom: 100px; left: 20px; right: 20px; display: flex; justify-content: space-between; }
.hud-float-btn { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px; font-weight: 600; backdrop-filter: blur(10px); cursor: pointer; }
.hud-float-btn.active { background: rgba(52, 211, 153, 0.2); border-color: var(--green); color: var(--green); }

.hud-bottom-card { margin: 0 20px 15px 20px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px; border: 1px solid rgba(255,255,255,0.1); }
.hud-bottom-card .icon-route { width: 54px; height: 54px; background: rgba(52, 211, 153, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green); font-size: 24px; border: 2px solid var(--green); }
.hud-bottom-card .info { flex: 1; }
.hud-bottom-card .info h3 { font-size: 18px; color: var(--green); margin-bottom: 4px; }
.hud-bottom-card .info p { font-size: 13px; color: var(--muted); }
.hud-bottom-card .time { text-align: right; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 16px; }
.hud-bottom-card .time b { display: block; font-size: 18px; margin-bottom: 2px; }
.hud-bottom-card .time span { font-size: 12px; color: var(--muted); }

.hud-tabs { display: flex; gap: 8px; padding: 0 20px 20px 20px; overflow-x: auto; }
.hud-tabs button { flex: 1; min-width: 70px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.hud-tabs button.active { background: rgba(52, 211, 153, 0.15); border-color: var(--green); color: var(--green); }
.hud-tabs button span { font-size: 24px; }

.hud-close { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); width: 44px; height: 44px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }

/* Utilitários */
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--panel); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 3000; display: none; border: 1px solid var(--panel-border); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<svg style="display:none">
  <defs>
    <linearGradient id="cg" x1="20" y1="10" x2="20" y2="35">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
</svg>

<!-- TELA INICIAL -->
<div id="map"></div>
<div class="top-bar">
  <div class="brand">
    <div class="brand-left"><span>🛡️</span> RotaSegura</div>
    <div style="background:rgba(52,211,153,.2);color:#34d399;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;">● GPS Ativo</div>
  </div>
  <div class="search-bar">
    <input id="destInput" type="text" placeholder="🔍 Para onde vamos?" onkeydown="if(event.key==='Enter')calcRoute()">
    <button onclick="calcRoute()">IR</button>
  </div>
</div>

<div class="bottom-panel">
  <div id="routeInfo" style="display:none;margin-bottom:15px;background:#1e293b;padding:12px;border-radius:12px;font-size:14px;display:flex;justify-content:space-between;">
    <div><b id="distChip">-- km</b><br><span style="font-size:12px;color:#94a3b8;">Distância</span></div>
    <div><b id="timeChip">-- min</b><br><span style="font-size:12px;color:#94a3b8;">Tempo</span></div>
    <div><b id="riskChip" style="color:#ef4444;">0</b><br><span style="font-size:12px;color:#94a3b8;">Riscos</span></div>
  </div>
  <button class="btn-primary" onclick="startHUD()">🚗 Iniciar Navegação</button>
  <button class="btn-secondary" onclick="centerOnUser()">📍 Centralizar no meu GPS</button>
</div>

<!-- MODO PARA-BRISA -->
<div id="hud">
  <div id="hud-bg"></div>
  <video id="hudVideo" autoplay playsinline muted></video>
  
  <!-- Estrada Neon 3D -->
  <div class="road-path"></div>
  <div class="chevron-container">
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
  </div>

  <!-- Interface do HUD -->
  <div class="hud-ui">
    <div class="hud-top">
      <div class="hud-header">
        <div class="brand-left" style="font-size:20px;font-weight:800;"><span>🛡️</span> RotaSegura</div>
        <button class="hud-close" onclick="stopHUD()">✕</button>
      </div>
      
      <div class="hud-nav-card">
        <div class="arrow">↪</div>
        <div class="info">
          <h1 id="hudDistance">1,3 km</h1>
          <h2 id="hudInstruction">Curva suave à direita</h2>
          <p id="hudStreet">R. Cmte. Ari Parreiras</p>
        </div>
      </div>
    </div>

    <div class="hud-middle">
      <div class="hud-traffic">
        <span class="icon">🚗</span>
        <div class="txt"><b>Trânsito</b><span>Livre</span></div>
      </div>
      
      <div class="hud-compass">
        <div class="arrow"></div>
        <div class="n">N</div>
      </div>
      
      <div class="hud-search-btn" onclick="stopHUD()">🔍</div>
      
      <div class="hud-risk">
        <div class="icon">⚠️</div>
        <b>350 m</b>
        <span>Ponto de risco</span>
      </div>
      
      <div class="hud-bottom-mid">
        <div class="hud-speed">
          <b id="hudSpeedVal">46</b>
          <span>km/h</span>
        </div>
        <div class="hud-street-pill">
          <span>🚗</span> R. Cmte. Ari Parreiras
        </div>
      </div>
    </div>

    <div>
      <div class="hud-floating-btns">
        <button class="hud-float-btn" onclick="centerOnUser()"><span>🎯</span> Recentralizar</button>
        <!-- BOTÃO DE VOZ AQUI -->
        <button class="hud-float-btn active" id="voiceBtn" onclick="toggleVoice()">
          <span id="voiceIcon">🔊</span> <span id="voiceText">Som</span>
        </button>
      </div>

      <div class="hud-bottom-card">
        <div class="icon-route">➔</div>
        <div class="info">
          <h3>Rota segura à frente</h3>
          <p>Sem incidentes na sua rota.</p>
        </div>
        <div class="time">
          <b id="hudTime">21 min</b>
          <span>Chegada: <span id="hudArrival">06:21</span></span>
        </div>
      </div>

      <div class="hud-tabs">
        <button class="active"><span>🚗</span> Carro</button>
        <button><span>🏍️</span> Moto</button>
        <button><span>🚲</span> Bike</button>
        <button><span>🚌</span> Ônibus</button>
        <button><span>🚶</span> A pé</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let map, userPos = null, userMarker = null;
let currentRoute = null, hudStream = null;
let destPos = null;

// ==========================================
// 1. SISTEMA DE VOZ (TEXT-TO-SPEECH)
// ==========================================
let synth = window.speechSynthesis;
let voiceEnabled = true;
let ptVoice = null;

function loadVoices() {
  const voices = synth.getVoices();
  // Procura uma voz em português (Brasil de preferência)
  ptVoice = voices.find(v => v.lang === 'pt-BR') || voices.find(v => v.lang.startsWith('pt')) || null;
}
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = loadVoices;
}
loadVoices();

function speak(text) {
  if (!voiceEnabled || !synth) return;
  synth.cancel(); // Cancela falas anteriores para não sobrepor
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-BR';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  if (ptVoice) utterance.voice = ptVoice;
  synth.speak(utterance);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  const btn = $('voiceBtn');
  if (voiceEnabled) {
    btn.classList.add('active');
    $('voiceIcon').textContent = '🔊';
    $('voiceText').textContent = 'Som';
    toast('Voz ativada');
    speak('Voz ativada');
  } else {
    btn.classList.remove('active');
    $('voiceIcon').textContent = '🔇';
    $('voiceText').textContent = 'Mudo';
    synth.cancel();
    toast('Voz desativada');
  }
}

// ==========================================
// 2. MAPA E GPS
// ==========================================
map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-22.9068, -43.1729], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function locateUser() {
  if (!navigator.geolocation) return toast('Geolocalização não suportada');
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker(userPos, { radius: 10, color: '#34d399', fillColor: '#34d399', fillOpacity: 1 }).addTo(map);
    map.setView(userPos, 15);
  }, err => toast('Erro ao pegar GPS. Usando padrão (RJ).'));
}
locateUser();

function centerOnUser() {
  if (userPos) map.setView(userPos, 16);
}

// ==========================================
// 3. CALCULAR ROTA
// ==========================================
async function calcRoute() {
  const q = $('destInput').value.trim();
  if (!q) return toast('Digite um destino');
  if (!userPos) return toast('Aguardando GPS...');
  
  toast('Buscando destino...');
  speak('Calculando rota.');
  
  try {
    const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1&countrycodes=br`);
    const gdata = await geo.json();
    if (!gdata.length) {
      speak('Destino não encontrado.');
      return toast('Destino não encontrado');
    }
    
    destPos = [parseFloat(gdata[0].lat), parseFloat(gdata[0].lon)];
    
    const rt = await fetch(`https://router.project-osrm.org/route/v1/driving/${userPos[1]},${userPos[0]};${destPos[1]},${destPos[0]}?overview=full&geometries=geojson`);
    const rdata = await rt.json();
    if (rdata.code !== 'Ok') {
      speak('Rota não encontrada.');
      return toast('Rota não encontrada');
    }
    
    currentRoute = rdata.routes[0];
    
    // Desenhar no mapa
    map.eachLayer(l => { if (l instanceof L.Polyline) map.removeLayer(l); });
    const coords = currentRoute.geometry.coordinates.map(c => [c[1], c[0]]);
    L.polyline(coords, { color: '#34d399', weight: 6, opacity: 0.9, lineCap: 'round' }).addTo(map);
    map.fitBounds(L.latLngBounds(coords), { padding: [50, 50] });
    
    // Atualizar UI
    const dist = (currentRoute.distance / 1000).toFixed(1).replace('.', ',');
    const dur = Math.round(currentRoute.duration / 60);
    const arr = new Date(Date.now() + currentRoute.duration * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    
    $('routeInfo').style.display = 'flex';
    $('distChip').textContent = dist + ' km';
    $('timeChip').textContent = dur + ' min';
    
    $('hudDistance').textContent = dist + ' km';
    $('hudTime').textContent = dur + ' min';
    $('hudArrival').textContent = arr;
    
    toast('Rota calculada!');
    speak(`Rota calculada. Distância de ${dist} quilômetros. Tempo estimado de ${dur} minutos.`);
    
  } catch (e) {
    toast('Erro ao calcular rota');
    speak('Erro ao calcular a rota.');
    console.error(e);
  }
}

// ==========================================
// 4. MODO PARA-BRISA (HUD)
// ==========================================
let riskTimeout;

function startHUD() {
  $('hud').style.display = 'block';
  
  // Fala ao abrir
  speak('Navegação iniciada. Modo para-brisa ativado.');
  
  // Tenta ligar a câmera traseira
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => {
        hudStream = stream;
        $('hudVideo').srcObject = stream;
        $('hud-bg').style.display = 'none'; // Esconde a imagem se a câmera funcionar
      })
      .catch(err => {
        console.log("Câmera negada. Mostrando imagem de estrada.");
      });
  }

  // Simulação de velocidade (para ficar vivo)
  if (!window.speedInterval) {
    window.speedInterval = setInterval(() => {
      if ($('hud').style.display === 'block') {
        $('hudSpeedVal').textContent = Math.floor(Math.random() * 15) + 40;
      }
    }, 2500);
  }
  
  // Simula aviso de voz de risco após 6 segundos
  clearTimeout(riskTimeout);
  riskTimeout = setTimeout(() => {
    if ($('hud').style.display === 'block') {
      speak('Atenção. Ponto de risco a 350 metros à frente.');
    }
  }, 6000);
}

function stopHUD() {
  $('hud').style.display = 'none';
  $('hud-bg').style.display = 'block';
  
  // Para a voz se estiver falando
  if (synth) synth.cancel();
  clearTimeout(riskTimeout);
  
  if (hudStream) {
    hudStream.getTracks().forEach(t => t.stop());
    hudStream = null;
    $('hudVideo').srcObject = null;
  }
}

// ==========================================
// 5. UTILS
// ==========================================
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window.toastT);
  window.toastT = setTimeout(() => t.style.display = 'none', 3000);
}
</script>
