<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>RotaSegura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg-dark: #070f16;
  --panel: rgba(15, 23, 42, 0.85);
  --panel-border: rgba(255,255,255,0.1);
  --green: #34d399;
  --red: #ef4444;
  --text: #ffffff;
  --muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #000; color: var(--text); }

/* MAPA (TELA INICIAL) */
#map { position: fixed; inset: 0; z-index: 1; }

.top { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(to bottom, rgba(7,15,22,1), rgba(7,15,22,0.8), transparent); }
.top-row { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 6px; color: #fff; font-weight: 800; font-size: 18px; }
.brand span { color: var(--green); font-size: 22px; }
.search-bar { display: flex; gap: 8px; }
.search-bar input { flex: 1; background: var(--panel); border: 1px solid var(--panel-border); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none; backdrop-filter: blur(10px); }
.search-bar button { background: var(--green); color: #000; border: none; padding: 0 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }

/* BOTTOM PANEL (TELA INICIAL) */
.bottom-panel { position: fixed; bottom: 0; left: 0; right: 0; z-index: 500; background: var(--bg-dark); padding: 20px 15px; border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 1px solid var(--panel-border); }
.btn-primary { width: 100%; background: var(--green); color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }

/* ========================================= */
/* MODO PARA-BRISA (HUD) - IDÊNTICO À FOTO   */
/* ========================================= */
#hud {
  position: fixed; inset: 0; z-index: 2000; display: none;
  background: #111; overflow: hidden;
}
/* Fundo simulando a estrada (Caso a câmera falhe) */
#hud-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  background-image: url('https://images.unsplash.com/photo-1542392656-9bc048221431?q=80&w=1000&auto=format&fit=crop');
  background-size: cover; background-position: center; z-index: 0;
}
/* Vídeo da câmera real */
#hud video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

/* Rota Azul 3D no chão */
.road-path {
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  width: 300px; height: 60vh;
  background: linear-gradient(to top, rgba(0, 162, 255, 0.4) 0%, rgba(0, 162, 255, 0.1) 80%, transparent 100%);
  clip-path: polygon(40% 100%, 60% 100%, 100% 0, 0 0);
  z-index: 2; pointer-events: none;
  filter: drop-shadow(0 0 20px rgba(0, 162, 255, 0.6));
}

/* Setas flutuantes na estrada */
.chevron-container {
  position: absolute; inset: 0; z-index: 2; perspective: 500px; pointer-events: none;
}
.chevron {
  position: absolute; bottom: 0; left: 50%;
  width: 120px; height: 80px;
  margin-left: -60px;
  opacity: 0;
  animation: driveUp 1.8s linear infinite;
}
.chevron svg { width: 100%; height: 100%; fill: none; stroke: #00d2ff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 10px #00d2ff); }
@keyframes driveUp {
  0% { bottom: 15%; transform: scale(0.2) rotateX(70deg); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { bottom: 80%; transform: scale(1.5) rotateX(70deg); opacity: 0; }
}
.chevron:nth-child(1) { animation-delay: 0s; }
.chevron:nth-child(2) { animation-delay: 0.3s; }
.chevron:nth-child(3) { animation-delay: 0.6s; }
.chevron:nth-child(4) { animation-delay: 0.9s; }
.chevron:nth-child(5) { animation-delay: 1.2s; }
.chevron:nth-child(6) { animation-delay: 1.5s; }

/* UI DO HUD */
.hud-ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.hud-ui > * { pointer-events: auto; }

/* Topo (Header e Card) */
.hud-top { padding: 20px; display: flex; flex-direction: column; gap: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
.hud-header { display: flex; justify-content: space-between; align-items: center; }
.hud-nav-card {
  background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px);
  border-radius: 24px; padding: 20px; display: flex; gap: 20px; align-items: center;
  border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.hud-nav-card .arrow { font-size: 50px; color: #fff; line-height: 1; font-weight: 300; }
.hud-nav-card .info h1 { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
.hud-nav-card .info h2 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.hud-nav-card .info p { font-size: 15px; color: var(--muted); }

/* Widgets do meio (Trânsito, Bússola, Risco) */
.hud-middle { position: relative; flex: 1; }
.hud-traffic {
  position: absolute; top: 10px; left: 20px; background: rgba(15, 23, 42, 0.85);
  padding: 12px 16px; border-radius: 16px; display: flex; gap: 10px; align-items: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
}
.hud-traffic .icon { font-size: 18px; }
.hud-traffic .txt b { display: block; font-size: 12px; color: #fff; }
.hud-traffic .txt span { font-size: 12px; color: var(--green); font-weight: 600; }

.hud-compass {
  position: absolute; top: 10px; right: 20px; width: 54px; height: 54px; background: rgba(15, 23, 42, 0.85);
  border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
}
.hud-compass .arrow { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid var(--red); margin-bottom: 2px; }
.hud-compass .n { color: #fff; font-size: 12px; font-weight: 700; }

.hud-search-btn {
  position: absolute; top: 75px; right: 20px; width: 54px; height: 54px; background: rgba(15, 23, 42, 0.85);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); font-size: 20px; cursor: pointer;
}

.hud-risk {
  position: absolute; top: 140px; right: 20px; background: linear-gradient(135deg, #ef4444, #b91c1c);
  border-radius: 50%; width: 80px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); border: 2px solid rgba(255,255,255,0.3);
}
.hud-risk .icon { font-size: 24px; margin-bottom: -4px; }
.hud-risk b { font-size: 18px; }
.hud-risk span { font-size: 10px; font-weight: 600; text-align: center; line-height: 1; }

/* Velocímetro e Rua Atual */
.hud-bottom-mid { position: absolute; bottom: 160px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; align-items: flex-end; }
.hud-speed { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(52, 211, 153, 0.3); }
.hud-speed b { font-size: 28px; line-height: 1; }
.hud-speed span { font-size: 11px; color: #fff; }
.hud-street-pill { background: rgba(15, 23, 42, 0.85); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }

/* Botões Flutuantes (Recentralizar / Som) */
.hud-floating-btns { position: absolute; bottom: 100px; left: 20px; right: 20px; display: flex; justify-content: space-between; }
.hud-float-btn { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px; font-weight: 600; backdrop-filter: blur(10px); cursor: pointer; }

/* Card Inferior (Rota) */
.hud-bottom-card { margin: 0 20px 15px 20px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px; border: 1px solid rgba(255,255,255,0.1); }
.hud-bottom-card .icon-route { width: 50px; height: 50px; background: rgba(52, 211, 153, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green); font-size: 24px; border: 2px solid var(--green); }
.hud-bottom-card .info { flex: 1; }
.hud-bottom-card .info h3 { font-size: 18px; color: var(--green); margin-bottom: 4px; }
.hud-bottom-card .info p { font-size: 13px; color: var(--muted); }
.hud-bottom-card .time { text-align: right; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 16px; }
.hud-bottom-card .time b { display: block; font-size: 18px; margin-bottom: 2px; }
.hud-bottom-card .time span { font-size: 12px; color: var(--muted); }

/* Abas de Transporte */
.hud-tabs { display: flex; gap: 8px; padding: 0 20px 20px 20px; overflow-x: auto; }
.hud-tabs button { flex: 1; min-width: 70px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.hud-tabs button.active { background: rgba(52, 211, 153, 0.1); border-color: var(--green); color: var(--green); }
.hud-tabs button span { font-size: 24px; }

/* Botão Fechar (X) */
.hud-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 20; }

/* Toast */
#toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--panel); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 2500; display: none; border: 1px solid var(--panel-border); }
</style>
</head>
<body>

<!-- SVG OCULTO PARA AS SETAS DO CHÃO -->
<svg style="display:none">
  <defs>
    <linearGradient id="cg" x1="20" y1="10" x2="20" y2="35">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
</svg>

<!-- TELA INICIAL -->
<div id="map"></div>
<div class="top">
  <div class="top-row">
    <div class="brand"><span>🛡️</span> RotaSegura</div>
    <div style="background:rgba(52,211,153,.2);color:#34d399;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;">● GPS ativo</div>
  </div>
  <div class="search-bar">
    <input id="destInput" type="text" placeholder="🔍 Para onde vamos?">
    <button onclick="startHUD()">Iniciar</button>
  </div>
</div>
<div class="bottom-panel">
  <h3 style="margin-bottom:10px;color:#34d399;">📍 Sua localização</h3>
  <button class="btn-primary" onclick="startHUD()">🚗 Abrir Modo Para-Brisa</button>
</div>

<!-- MODO PARA-BRISA (HUD) -->
<div id="hud">
  <div id="hud-bg"></div>
  <video id="hudVideo" autoplay playsinline muted></video>
  
  <!-- Estrada Neon -->
  <div class="road-path"></div>
  <div class="chevron-container">
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
    <div class="chevron"><svg viewBox="0 0 40 40"><path d="M5 25 L20 10 L35 25 L28 25 L28 35 L12 35 L12 25 Z" fill="url(#cg)" stroke="#00d2ff" stroke-width="2"/></svg></div>
  </div>

  <!-- Interface do HUD -->
  <div class="hud-ui">
    
    <!-- TOPO -->
    <div class="hud-top">
      <div class="hud-header">
        <div class="brand" style="font-size:20px;"><span>🛡️</span> RotaSegura</div>
        <button class="hud-close" onclick="stopHUD()">✕</button>
      </div>
      
      <div class="hud-nav-card">
        <div class="arrow">↪</div>
        <div class="info">
          <h1>1,3 km</h1>
          <h2>Curva suave à direita</h2>
          <p>R. Cmte. Ari Parreiras</p>
        </div>
      </div>
    </div>

    <!-- MEIO (Widgets) -->
    <div class="hud-middle">
      <div class="hud-traffic">
        <span class="icon">🚗</span>
        <div class="txt"><b>Trânsito</b><span>Livre</span></div>
      </div>
      
      <div class="hud-compass">
        <div class="arrow"></div>
        <div class="n">N</div>
      </div>
      
      <div class="hud-search-btn" onclick="stopHUD()">🔍</div>
      
      <div class="hud-risk">
        <div class="icon">⚠️</div>
        <b>350 m</b>
        <span>Ponto de risco</span>
      </div>
      
      <div class="hud-bottom-mid">
        <div class="hud-speed">
          <b id="hudSpeedVal">46</b>
          <span>km/h</span>
        </div>
        <div class="hud-street-pill">
          <span>🚗</span> R. Cmte. Ari Parreiras
        </div>
      </div>
    </div>

    <!-- BASE (Botões e Card) -->
    <div>
      <div class="hud-floating-btns">
        <button class="hud-float-btn"><span>🎯</span> Recentralizar</button>
        <button class="hud-float-btn"><span>🔊</span> Som</button>
      </div>

      <div class="hud-bottom-card">
        <div class="icon-route">➔</div>
        <div class="info">
          <h3>Rota segura à frente</h3>
          <p>Sem incidentes na sua rota.</p>
        </div>
        <div class="time">
          <b>21 min</b>
          <span>Chegada: 06:21</span>
        </div>
      </div>

      <div class="hud-tabs">
        <button class="active"><span>🚗</span> Carro</button>
        <button><span>🏍️</span> Moto</button>
        <button><span>🚲</span> Bike</button>
        <button><span>🚌</span> Ônibus</button>
        <button><span>🚶</span> A pé</button>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let map, hudStream = null;

// 1. Inicia o Mapa no fundo
map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-22.9068, -43.1729], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// 2. Função para ligar a Câmera (Modo Para-brisa)
function startHUD() {
  $('hud').style.display = 'block';
  
  // Tenta ligar a câmera do celular
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => {
        hudStream = stream;
        $('hudVideo').srcObject = stream;
        // Esconde a imagem de fundo se a câmera funcionar
        $('hud-bg').style.display = 'none';
      })
      .catch(err => {
        console.log("Câmera não disponível ou negada, usando imagem de fundo de estrada.");
      });
  }

  // Efeito de velocidade piscando
  let v = 45;
  setInterval(() => {
    if($('hud').style.display === 'block') {
      v = 42 + Math.floor(Math.random() * 8);
      $('hudSpeedVal').textContent = v;
    }
  }, 2000);
}

// 3. Desliga o Modo Para-brisa
function stopHUD() {
  $('hud').style.display = 'none';
  $('hud-bg').style.display = 'block'; // Reseta o fundo
  if (hudStream) {
    hudStream.getTracks().forEach(t => t.stop());
    hudStream = null;
    $('hudVideo').srcObject = null;
  }
}
</script>
</body>
</html>
