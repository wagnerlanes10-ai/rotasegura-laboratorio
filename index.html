<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>RotaSegura - Premium Navigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --neon-blue: #00bfff;
  --neon-cyan: #42dcff;
  --neon-glow: rgba(0, 191, 255, 0.6);
  --glass-bg: rgba(2, 17, 39, 0.85);
  --glass-border: rgba(0, 191, 255, 0.4);
  --text-primary: #f4faff;
  --text-secondary: #8aa4c0;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { 
  height: 100%; 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #000;
  color: var(--text-primary);
  overflow: hidden;
}

/* ===== TEMA AUTOMÁTICO ===== */
body.day-mode {
  --glass-bg: rgba(255, 255, 255, 0.9);
  --neon-glow: rgba(0, 191, 255, 0.4);
}

#map { 
  position: absolute; 
  inset: 0; 
  z-index: 1;
  background: #0a1628;
}

/* Filtro noturno no mapa */
.map-night .leaflet-tile-pane {
  filter: brightness(0.4) contrast(1.2) saturate(0.8) hue-rotate(190deg);
}

.map-day .leaflet-tile-pane {
  filter: brightness(1) contrast(1) saturate(1);
}

/* Overlay de chuva no mapa */
#mapRainOverlay {
  position: absolute;
  inset: 0;
  z-index: 400;
  pointer-events: none;
  opacity: 0.6;
}

/* ===== MODO PARA-BRISA PREMIUM ===== */
.windshield-premium {
  position: fixed;
  inset: 0;
  z-index: 2000;
  overflow: hidden;
  background: #000;
}

.ws-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* Imagem de estrada chuvosa profissional */
  background: linear-gradient(180deg, 
    #1a2a3a 0%, 
    #2a3a4a 40%, 
    #1a2a3a 100%);
}

/* Efeito de reflexo molhado */
.ws-wet-reflection {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(0, 150, 255, 0.1) 50%,
    rgba(255, 200, 100, 0.15) 100%);
  pointer-events: none;
  mix-blend-mode: overlay;
}

/* Canvas de chuva */
#wsRainCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* Overlay escuro para legibilidade */
.ws-dark-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom, 
    rgba(0,0,0,0.6) 0%, 
    rgba(0,0,0,0.2) 40%,
    rgba(0,0,0,0.3) 60%,
    rgba(0,0,0,0.7) 100%
  );
  z-index: 3;
  pointer-events: none;
}

/* ===== INTERFACE GLASSMORPHISM PREMIUM ===== */
.glass-premium {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    0 0 20px var(--neon-glow);
}

/* Status Bar */
.status-bar-premium {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
}

.brand-premium {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.brand-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 15px var(--neon-glow);
}

.weather-badge-premium {
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
}

/* Cartão de Navegação Premium */
.nav-card-premium {
  position: absolute;
  top: 80px;
  left: 16px;
  z-index: 10;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 280px;
  max-width: 340px;
}

.maneuver-premium {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 25px var(--neon-glow);
  animation: pulse-glow 2s infinite;
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 25px var(--neon-glow); }
  50% { box-shadow: 0 0 35px rgba(0, 191, 255, 0.9); }
}

.maneuver-premium svg {
  width: 36px;
  height: 36px;
  fill: white;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.nav-text-premium strong {
  display: block;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-primary);
}

.nav-text-premium .distance {
  color: var(--neon-cyan);
  font-size: 15px;
  font-weight: 600;
  margin-top: 4px;
}

/* Botões Laterais Premium */
.side-controls-premium {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.side-btn-premium {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.side-btn-premium:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px var(--neon-glow);
}

.side-btn-premium svg {
  width: 24px;
  height: 24px;
  fill: var(--neon-cyan);
}

/* HUD Inferior Premium */
.hud-bottom-premium {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 320px;
  max-width: 90%;
}

.speedometer-premium {
  position: relative;
  width: 70px;
  height: 70px;
  flex-shrink: 0;
}

.speedometer-premium svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.speedo-bg {
  fill: none;
  stroke: rgba(255,255,255,0.1);
  stroke-width: 6;
}

.speedo-fill {
  fill: none;
  stroke: var(--neon-blue);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 188;
  stroke-dashoffset: 188;
  transition: stroke-dashoffset 0.6s ease;
  filter: drop-shadow(0 0 8px var(--neon-glow));
}

.speedo-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.speedo-val {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}

.speedo-unit {
  font-size: 10px;
  color: var(--text-secondary);
}

.hud-divider {
  width: 1px;
  height: 50px;
  background: linear-gradient(to bottom, transparent, var(--neon-blue), transparent);
}

.hud-arrow-premium {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.hud-arrow-icon-premium {
  width: 42px;
  height: 42px;
  background: rgba(0, 191, 255, 0.15);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hud-arrow-icon-premium svg {
  width: 28px;
  height: 28px;
  fill: var(--neon-cyan);
  filter: drop-shadow(0 0 6px var(--neon-glow));
}

.hud-arrow-info .dist {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.hud-arrow-info .label {
  font-size: 12px;
  color: var(--text-secondary);
}

.hud-stats-premium {
  display: flex;
  gap: 18px;
}

.hud-stat-premium {
  text-align: center;
}

.hud-stat-premium .value {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}

.hud-stat-premium .label {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* Botão de Sair */
.ws-exit-premium {
  position: absolute;
  bottom: 110px;
  right: 20px;
  z-index: 10;
  padding: 12px 20px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
}

.ws-exit-premium:active {
  transform: scale(0.95);
}

/* Botão de Chuva */
.rain-toggle-premium {
  position: absolute;
  right: 16px;
  bottom: 160px;
  z-index: 10;
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

/* Seta Neon no Mapa */
#neonArrowCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 500;
  pointer-events: none;
}

/* Responsivo */
@media (max-width: 480px) {
  .nav-card-premium { min-width: 240px; padding: 14px; }
  .hud-bottom-premium { flex-wrap: wrap; padding: 12px; }
  .hud-stats-premium { gap: 12px; }
  .speedometer-premium { width: 60px; height: 60px; }
}
</style>
</head>
<body>

<!-- MAPA PRINCIPAL -->
<div id="map"></div>
<canvas id="mapRainOverlay"></canvas>
<canvas id="neonArrowCanvas"></canvas>

<!-- Painel Superior do Mapa -->
<div id="mapNavCard" class="glass-premium" style="position:absolute;top:10px;left:10px;right:10px;z-index:1000;padding:14px;display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div style="font-size:18px;font-weight:700;color:var(--neon-blue);">️ RotaSegura</div>
    <div id="mapWeatherBadge" class="weather-badge-premium glass-premium">
      <span>🌤️</span>
      <span>Carregando...</span>
    </div>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:8px;">
    <input id="mapDestino" placeholder="Para onde?" style="flex:1;height:44px;border-radius:12px;border:1px solid var(--glass-border);padding:0 14px;background:rgba(255,255,255,0.05);color:var(--text-primary);font-size:15px;">
    <button id="mapBuscar" style="height:44px;padding:0 22px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--neon-blue),var(--neon-cyan));color:#fff;font-weight:700;cursor:pointer;">Ir</button>
  </div>
  <div id="mapStatus" style="font-size:12px;color:var(--text-secondary);">📡 Buscando localização...</div>
</div>

<!-- HUD Inferior do Mapa -->
<div id="mapBottomHUD" class="glass-premium hud-bottom-premium" style="display:none;">
  <div class="speedometer-premium">
    <svg><circle class="speedo-bg" cx="35" cy="35" r="30"/><circle class="speedo-fill" id="mapSpeedoFill" cx="35" cy="35" r="30"/></svg>
    <div class="speedo-text"><div class="speedo-val" id="mapSpeedVal">0</div><div class="speedo-unit">km/h</div></div>
  </div>
  <div class="hud-divider"></div>
  <div class="hud-arrow-premium">
    <div class="hud-arrow-icon-premium"><svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg></div>
    <div><div class="dist" id="mapHudDist">350m</div><div class="label" id="mapHudLabel">Destino</div></div>
  </div>
  <div class="hud-divider"></div>
  <div class="hud-stats-premium">
    <div class="hud-stat-premium"><div class="value">🕐 <span id="mapTime">12 min</span></div><div class="label" id="mapKm">8.4 km</div></div>
    <div class="hud-stat-premium"><div class="value">🏁 <span id="mapArrival">14:44</span></div><div class="label">Chegada</div></div>
  </div>
</div>

<!-- Botões Laterais do Mapa -->
<div class="side-controls-premium" style="left:16px;right:auto;">
  <div class="side-btn-premium" id="mapLocateBtn">📍</div>
  <div class="side-btn-premium" id="mapThemeBtn">🌙</div>
</div>

<div class="side-controls-premium">
  <div class="side-btn-premium" id="mapWindshieldBtn" style="display:none;">🚗</div>
  <div class="side-btn-premium" id="mapZoomIn">+</div>
  <div class="side-btn-premium" id="mapZoomOut">−</div>
</div>

<!-- MODO PARA-BRISA PREMIUM -->
<div id="windshieldPremium" class="windshield-premium" style="display:none;">
  <div class="ws-background"></div>
  <div class="ws-wet-reflection"></div>
  <canvas id="wsRainCanvas"></canvas>
  <div class="ws-dark-overlay"></div>

  <!-- Status Bar -->
  <div class="status-bar-premium glass-premium">
    <div class="brand-premium">
      <div class="brand-icon">🛡️</div>
      <span>RotaSegura</span>
    </div>
    <div class="status-info glass-premium" style="padding:8px 12px;border-radius:12px;">
      <span id="wsClock">14:32</span>
      <span>📶</span>
      <span>4G</span>
      <span></span>
    </div>
  </div>

  <!-- Cartão de Navegação -->
  <div class="nav-card-premium glass-premium">
    <div class="maneuver-premium">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <div class="nav-text-premium">
      <strong>Na rotatória,<br>pegue a 2ª saída</strong>
      <div class="distance">300 m</div>
    </div>
  </div>

  <!-- Indicador de Chuva -->
  <div class="weather-badge-premium glass-premium rain-toggle-premium" id="wsRainToggle">
    <span>🌧️</span>
    <span>Chuva: ON</span>
  </div>

  <!-- Botões Laterais -->
  <div class="side-controls-premium" style="left:16px;right:auto;">
    <div class="side-btn-premium">🧭</div>
    <div class="side-btn-premium">🔊</div>
    <div class="side-btn-premium"></div>
  </div>

  <div class="side-controls-premium">
    <div class="side-btn-premium"></div>
    <div class="side-btn-premium">+</div>
    <div class="side-btn-premium">−</div>
  </div>

  <!-- HUD Inferior -->
  <div class="hud-bottom-premium glass-premium">
    <div class="speedometer-premium">
      <svg><circle class="speedo-bg" cx="35" cy="35" r="30"/><circle class="speedo-fill" id="wsSpeedoFill" cx="35" cy="35" r="30"/></svg>
      <div class="speedo-text"><div class="speedo-val" id="wsSpeedVal">52</div><div class="speedo-unit">km/h</div></div>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-arrow-premium">
      <div class="hud-arrow-icon-premium"><svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg></div>
      <div><div class="dist">300 m</div><div class="label">Rotatória</div></div>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-stats-premium">
      <div class="hud-stat-premium"><div class="value"> 12 min</div><div class="label">8,4 km</div></div>
      <div class="hud-stat-premium"><div class="value">🏁 14:44</div><div class="label">Chegada</div></div>
    </div>
  </div>

  <!-- Botão Sair -->
  <button class="ws-exit-premium glass-premium" onclick="closeWindshieldPremium()">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    Sair
  </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== SISTEMA DE TEMA AUTOMÁTICO DIA/NOITE =====
function updateTheme() {
  const hour = new Date().getHours();
  const isNight = hour >= 18 || hour < 5; // 17:41 às 4:59 = noite
  
  document.body.classList.toggle('day-mode', !isNight);
  
  // Atualiza mapa
  const mapContainer = document.querySelector('#map');
  if (isNight) {
    mapContainer.classList.add('map-night');
    mapContainer.classList.remove('map-day');
  } else {
    mapContainer.classList.add('map-day');
    mapContainer.classList.remove('map-night');
  }
  
  return isNight;
}

let isNightMode = updateTheme();
setInterval(updateTheme, 60000); // Atualiza a cada minuto

// ===== MAPA LEAFLET =====
const map = L.map('map', { zoomControl: false }).setView([-22.9068, -43.1729], 13);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Tiles do OpenStreetMap
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

let userPos = null;
let routeLines = [];
let currentWeather = { raining: false };

const $ = id => document.getElementById(id);

// ===== CLIMA REAL (Open-Meteo) =====
async function consultarClima(lat, lon) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=precipitation,weathercode&timezone=America/Sao_Paulo`;
    const res = await fetch(url);
    const data = await res.json();
    
    const precip = data.current.precipitation || 0;
    const codigosChuva = [51,53,55,61,63,65,80,81,82,95,96,99];
    const estaChovendo = codigosChuva.includes(data.current.weathercode) || precip > 0;
    
    currentWeather = { raining: estaChovendo, precipitation: precip };
    
    // Atualiza badge
    const badge = $('mapWeatherBadge');
    if (estaChovendo) {
      badge.innerHTML = `<span>🌧️</span><span>${precip.toFixed(1)}mm/h</span>`;
    } else {
      badge.innerHTML = `<span>☀️</span><span>Sem chuva</span>`;
    }
    
    return estaChovendo;
  } catch (err) {
    console.error('Erro clima:', err);
    return false;
  }
}

// ===== GPS =====
function locate() {
  $('mapStatus').textContent = '📡 Buscando localização...';
  
  navigator.geolocation.getCurrentPosition(
    async pos => {
      userPos = [pos.coords.latitude, pos.coords.longitude];
      
      const icon = L.divIcon({
        html: '<div style="width:20px;height:20px;background:#00bfff;border-radius:50%;border:3px solid white;box-shadow:0 0 15px rgba(0,191,255,0.8);"></div>',
        iconSize: [20, 20]
      });
      
      L.marker(userPos, { icon }).addTo(map);
      map.setView(userPos, 15);
      $('mapStatus').textContent = '✅ Localização ativa';
      $('mapWindshieldBtn').style.display = 'flex';
      
      await consultarClima(userPos[0], userPos[1]);
    },
    () => $('mapStatus').textContent = '️ GPS negado. Toque no mapa.',
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

$('mapLocateBtn').onclick = locate;
map.on('click', e => {
  if (!userPos) {
    userPos = [e.latlng.lat, e.latlng.lng];
    locate();
  }
});
locate();

// ===== BUSCAR ROTA =====
$('mapBuscar').onclick = async () => {
  const destino = $('mapDestino').value.trim();
  if (!destino || !userPos) return;
  
  $('mapBuscar').disabled = true;
  $('mapStatus').textContent = '🔎 Buscando...';
  
  try {
    // Geocoding
    const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(destino)}`);
    const geoData = await geo.json();
    if (!geoData.length) throw new Error('Não encontrado');
    
    const dest = { lat: parseFloat(geoData[0].lat), lon: parseFloat(geoData[0].lon) };
    
    // Rota
    const route = await fetch(`https://router.project-osrm.org/route/v1/driving/${userPos[1]},${userPos[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson`);
    const routeData = await route.json();
    
    if (routeData.code !== 'Ok') throw new Error('Rota não encontrada');
    
    const coords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    
    // Desenhar rota neon
    routeLines.forEach(l => map.removeLayer(l));
    routeLines = [];
    
    const glow = L.polyline(coords, { color: '#00bfff', weight: 14, opacity: 0.4 }).addTo(map);
    const line = L.polyline(coords, { color: '#42dcff', weight: 7, opacity: 1 }).addTo(map);
    routeLines.push(glow, line);
    
    // Atualizar HUD
    const timeMin = Math.round(routeData.routes[0].duration / 60);
    const distKm = (routeData.routes[0].distance / 1000).toFixed(1);
    const arrival = new Date(Date.now() + routeData.routes[0].duration * 1000);
    
    $('mapHudDist').textContent = '350m';
    $('mapTime').textContent = timeMin + ' min';
    $('mapKm').textContent = distKm + ' km';
    $('mapArrival').textContent = arrival.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    
    $('mapBottomHUD').style.display = 'flex';
    $('mapNavCard').style.display = 'block';
    $('mapWindshieldBtn').style.display = 'flex';
    
    map.fitBounds(L.latLngBounds(coords), { padding: [100, 20] });
    
    // Iniciar seta neon no mapa
    drawMapNeonArrow(coords);
    
    // Iniciar chuva no mapa se estiver chovendo
    if (currentWeather.raining) {
      initMapRain();
    }
    
  } catch (err) {
    $('mapStatus').textContent = '❌ ' + err.message;
  } finally {
    $('mapBuscar').disabled = false;
  }
};

// ===== SETA NEON NO MAPA =====
function drawMapNeonArrow(coords) {
  const canvas = $('neonArrowCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  function draw() {
    if ($('windshieldPremium').style.display === 'block') {
      requestAnimationFrame(draw);
      return;
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Converter coordenadas da rota para pixels
    const lastPoint = coords[coords.length - 1];
    const point = map.latLngToContainerPoint(lastPoint);
    
    const cx = point.x;
    const cy = point.y;
    
    // Glow
    ctx.shadowColor = '#00bfff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(0,191,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 40);
    ctx.lineTo(cx - 25, cy + 20);
    ctx.lineTo(cx - 12, cy + 12);
    ctx.lineTo(cx - 12, cy + 35);
    ctx.lineTo(cx + 12, cy + 35);
    ctx.lineTo(cx + 12, cy + 12);
    ctx.lineTo(cx + 25, cy + 20);
    ctx.closePath();
    ctx.fill();
    
    // Seta principal
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#42dcff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 35);
    ctx.lineTo(cx - 20, cy + 15);
    ctx.lineTo(cx - 10, cy + 10);
    ctx.lineTo(cx - 10, cy + 30);
    ctx.lineTo(cx + 10, cy + 30);
    ctx.lineTo(cx + 10, cy + 10);
    ctx.lineTo(cx + 20, cy + 15);
    ctx.closePath();
    ctx.fill();
    
    requestAnimationFrame(draw);
  }
  draw();
}

// ===== CHUVA NO MAPA =====
function initMapRain() {
  const canvas = $('mapRainOverlay');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const drops = [];
  for (let i = 0; i < 100; i++) {
    drops.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 10 + Math.random() * 20,
      length: 10 + Math.random() * 15
    });
  }
  
  function draw() {
    if ($('windshieldPremium').style.display === 'block') {
      requestAnimationFrame(draw);
      return;
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(200, 230, 255, 0.2)';
    ctx.lineWidth = 1;
    
    drops.forEach(drop => {
      ctx.beginPath();
      ctx.moveTo(drop.x, drop.y);
      ctx.lineTo(drop.x, drop.y + drop.length);
      ctx.stroke();
      
      drop.y += drop.speed;
      if (drop.y > canvas.height) {
        drop.y = -drop.length;
        drop.x = Math.random() * canvas.width;
      }
    });
    
    requestAnimationFrame(draw);
  }
  draw();
}

// ===== MODO PARA-BRISA PREMIUM =====
let wsCameraStream = null;
let wsRainActive = true;

$('mapWindshieldBtn').onclick = async () => {
  $('windshieldPremium').style.display = 'block';
  
  try {
    wsCameraStream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'environment' } 
    });
    $('wsRainCanvas').srcObject = wsCameraStream;
    
    initWindshieldRain();
    updateWSClock();
    
  } catch (err) {
    alert('Erro na câmera');
    closeWindshieldPremium();
  }
};

function closeWindshieldPremium() {
  $('windshieldPremium').style.display = 'none';
  if (wsCameraStream) {
    wsCameraStream.getTracks().forEach(t => t.stop());
  }
}

// Relógio do para-brisa
function updateWSClock() {
  const now = new Date();
  $('wsClock').textContent = now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  setTimeout(updateWSClock, 30000);
}

// Chuva premium no para-brisa
function initWindshieldRain() {
  const canvas = $('wsRainCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  const drops = [];
  for (let i = 0; i < 200; i++) {
    drops.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: 1 + Math.random() * 3,
      speed: 15 + Math.random() * 30,
      opacity: 0.2 + Math.random() * 0.4
    });
  }
  
  let wiperProgress = -1;
  let nextWiper = performance.now() + 5000;
  
  function draw(time) {
    if (!wsRainActive || $('windshieldPremium').style.display === 'none') {
      requestAnimationFrame(draw);
      return;
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Limpador automático
    if (time >= nextWiper && wiperProgress < 0) {
      wiperProgress = 0;
    }
    
    if (wiperProgress >= 0) {
      wiperProgress += 0.02;
      if (wiperProgress >= 1) {
        wiperProgress = -1;
        nextWiper = time + 7000;
      }
      
      // Desenhar limpador
      const p = wiperProgress;
      const x = canvas.width * 0.1 + (canvas.width * 0.8) * p;
      const y = canvas.height * 0.85 - Math.sin(p * Math.PI) * canvas.height * 0.35;
      
      ctx.save();
      ctx.strokeStyle = 'rgba(100, 150, 200, 0.6)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.5, canvas.height * 0.98);
      ctx.quadraticCurveTo(canvas.width * 0.3, canvas.height * 0.92, x, y);
      ctx.stroke();
      ctx.restore();
    }
    
    // Gotas
    drops.forEach(drop => {
      ctx.beginPath();
      ctx.ellipse(drop.x, drop.y, drop.radius * 0.7, drop.radius * 1.5, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 230, 255, ${drop.opacity})`;
      ctx.fill();
      
      drop.y += drop.speed;
      if (drop.y > canvas.height) {
        drop.y = -5;
        drop.x = Math.random() * canvas.width;
      }
    });
    
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

// Toggle chuva
$('wsRainToggle').onclick = () => {
  wsRainActive = !wsRainActive;
  $('wsRainToggle').innerHTML = wsRainActive ? '<span>️</span><span>Chuva: ON</span>' : '<span>☀️</span><span>Chuva: OFF</span>';
};

// Velocímetro animado
setInterval(() => {
  const speed = Math.floor(Math.random() * 30) + 40;
  $('mapSpeedVal').textContent = speed;
  $('wsSpeedVal').textContent = speed;
  
  const circumference = 2 * Math.PI * 30;
  const offset = circumference - (speed / 120) * circumference;
  $('mapSpeedoFill').style.strokeDashoffset = offset;
  $('wsSpeedoFill').style.strokeDashoffset = offset;
}, 2000);

// Resize
window.addEventListener('resize', () => {
  $('neonArrowCanvas').width = window.innerWidth;
  $('neonArrowCanvas').height = window.innerHeight;
  $('mapRainOverlay').width = window.innerWidth;
  $('mapRainOverlay').height = window.innerHeight;
});
</script>
